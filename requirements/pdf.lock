# Hash-locked optional PDF reader for the files skills (files-answer, research-report): pypdf, pure Python,
# BSD-3-Clause (read in the LICENSE file of both the wheel and the sdist). No dependencies on Python 3.11 and later.
# Install after the other locks when you want PDFs read:
#
#   pip install --require-hashes -r requirements/pdf.lock
#
# Without it the skills still run and say "PDF reading is not installed; N PDFs were skipped".
