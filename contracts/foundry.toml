[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
ffi = false
# Phase 0: unit tests only. There is no deploy script and no RPC endpoint.
# Do not add a mainnet rpc_url here.

[fuzz]
runs = 256

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
