<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>健康管理助理</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b6a61'/%3E%3Cpath d='M16 7v18M7 16h18' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme:light dark;
  --bg:#f5f6f2; --surface:#ffffff; --surface2:#eef1ec; --ink:#1c2321; --muted:#53605a; --line:#d3d9d2;
  --accent:#0b6a61; --accent-ink:#ffffff; --accent-soft:#e1f1ee;
  --ok:#12713c; --warn:#8a4b00; --bad:#b3261e; --info:#24559f;
  --bad-soft:#fdecea; --warn-soft:#fff3e0; --info-soft:#e8f0fb; --ok-soft:#e5f4ea;
  --user-bubble:#0b6a61; --user-ink:#ffffff;
  --font:system-ui,-apple-system,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",Roboto,"Helvetica Neue",Arial,sans-serif;
  --nav-h:68px; --top-h:56px; --navoff:calc(var(--nav-h) + env(safe-area-inset-bottom));
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#111614; --surface:#1a201d; --surface2:#232b27; --ink:#e9eeea; --muted:#a2b0a9; --line:#334039;
    --accent:#5cd6c5; --accent-ink:#06211d; --accent-soft:#17332f;
    --ok:#6fd99a; --warn:#f0b455; --bad:#ff8c82; --info:#8fb8ff;
    --bad-soft:#3a1d1a; --warn-soft:#33260f; --info-soft:#1b2a40; --ok-soft:#173222;
    --user-bubble:#2d7f75; --user-ink:#ffffff;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 var(--font);overflow-wrap:anywhere;min-height:100vh}
h1,h2,h3,h4,p,ul,ol,figure{margin:0}
ul,ol{padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-80px;background:var(--surface);padding:10px 14px;border-radius:8px;z-index:100;border:2px solid var(--accent)}
.skip:focus{top:8px}
svg.i{width:1.25em;height:1.25em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.25em}
[hidden]{display:none!important}

/* shell */
body.app{display:block}
#top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;min-height:var(--top-h);padding:6px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
#top .brand{flex:1;min-width:0;font-weight:700;font-size:1rem;display:flex;gap:8px;align-items:center}
#top .brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#top .brand .logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
#top .brand .logo svg{width:20px;height:20px}
main{display:block;max-width:760px;margin:0 auto;padding:18px 16px calc(var(--navoff) + 28px);outline:none}
body.auth main{padding-bottom:40px;max-width:560px}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);height:var(--navoff);padding-bottom:env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--line)}
#tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:44px;color:var(--muted);text-decoration:none;font-size:.8125rem;font-weight:600;line-height:1.2;text-align:center;padding:4px 2px}
#tabs a svg{width:26px;height:26px}
#tabs a[aria-current="page"]{color:var(--accent)}
#tabs a[aria-current="page"] svg{stroke-width:2.6}
#tabs a[aria-current="page"] span{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}
@media (min-width:900px){
  body.app{display:grid;grid-template-columns:230px minmax(0,1fr);grid-template-rows:auto 1fr;--navoff:0px}
  #top{grid-column:1/-1}
  #tabs{position:sticky;top:var(--top-h);grid-column:1;grid-row:2;align-self:start;display:flex;flex-direction:column;gap:4px;height:auto;padding:14px 12px;border-top:0;border-right:1px solid var(--line);background:transparent;min-height:calc(100vh - var(--top-h))}
  #tabs a{flex-direction:row;justify-content:flex-start;gap:12px;font-size:1.0625rem;padding:10px 14px;border-radius:12px;min-height:50px;text-align:left}
  #tabs a[aria-current="page"]{background:var(--accent-soft)}
  #tabs a[aria-current="page"] span{text-decoration:none}
  main{grid-column:2;grid-row:2;width:100%;padding:28px 32px 48px}
  body.auth{display:block}
}

/* type */
h1{font-size:1.6rem;line-height:1.25;font-weight:700;letter-spacing:.01em}
h2{font-size:1.3rem;line-height:1.3;font-weight:700}
h3{font-size:1.1rem;line-height:1.35;font-weight:700}
.lead{font-size:1.0625rem;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.9375rem}
.page-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.page-head h1{flex:1;min-width:8rem}
.stack{display:grid;gap:14px}
.stack.tight{gap:8px}
.sec{margin-top:26px}
.sec>h2{margin-bottom:10px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:8px 18px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;cursor:pointer;text-decoration:none;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.danger.solid{background:var(--bad);color:#fff}
.btn.block{display:flex;width:100%}
.btn.small{min-height:44px;padding:6px 14px;font-size:.9375rem}
.btn.quiet{border-color:transparent;background:transparent;color:var(--accent)}
.btn.icon{padding:0;width:48px}
.btn:disabled,.btn[aria-busy="true"]{opacity:.55;cursor:not-allowed}
.field{display:grid;gap:6px}
.field>label,.field>.lbl{font-weight:600}
.field .hint{color:var(--muted);font-size:.9375rem}
.in{width:100%;min-height:48px;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
textarea.in{min-height:120px;resize:vertical;line-height:1.5}
.in:focus-visible{border-color:var(--accent);outline-offset:1px}
.pw{display:flex;gap:8px}
.pw .in{flex:1;min-width:0}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0}
.check input{width:26px;height:26px;margin:2px 0 0;flex:none;accent-color:var(--accent)}
.err{display:flex;gap:8px;align-items:flex-start;color:var(--bad);font-weight:600;background:var(--bad-soft);border:1px solid var(--bad);border-radius:10px;padding:10px 12px}
.err svg{margin-top:.2em}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;min-height:44px;padding:6px 16px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button+button{border-left:2px solid var(--line)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.flat{background:transparent}
.card h2,.card h3{margin-bottom:6px}
.note{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:12px 14px;border:1px solid var(--line);background:var(--surface2)}
.note svg{margin-top:.2em;flex:none}
.note.info{background:var(--info-soft);border-color:var(--info)}
.note.info svg{color:var(--info)}
.note.warn{background:var(--warn-soft);border-color:var(--warn)}
.note.warn svg{color:var(--warn)}
.note.ok{background:var(--ok-soft);border-color:var(--ok)}
.note.ok svg{color:var(--ok)}
.note.bad{background:var(--bad-soft);border-color:var(--bad)}
.note.bad svg{color:var(--bad)}
.note .body{display:grid;gap:8px;min-width:0;flex:1}
.cols2{display:grid;gap:12px}
@media (min-width:640px){.cols2{grid-template-columns:1fr 1fr}}
.bullets li{position:relative;padding-left:24px;margin:6px 0}
.bullets li::before{content:"";position:absolute;left:6px;top:.7em;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.bullets.no li::before{background:var(--bad)}
.consent{white-space:pre-line;border:2px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);max-height:16rem;overflow:auto}
.strength{display:grid;gap:4px}
.strength .bars{display:flex;gap:4px}
.strength .bars i{flex:1;height:8px;border-radius:4px;background:var(--surface2);box-shadow:inset 0 0 0 1px var(--line)}
.strength .bars i.on{background:var(--accent);box-shadow:none}
.strength[data-s="0"] .bars i.on,.strength[data-s="1"] .bars i.on{background:var(--warn)}

/* chat */
.chat{display:flex;flex-direction:column;min-height:calc(100dvh - var(--top-h) - var(--navoff) - 46px)}
.msgs>*{scroll-margin-bottom:calc(var(--navoff) + 130px)}
.msgs{flex:1;display:grid;gap:14px;align-content:start;padding-bottom:16px}
.bubble{max-width:88%;padding:12px 16px;border-radius:18px;white-space:pre-wrap}
.bubble.user{justify-self:end;background:var(--user-bubble);color:var(--user-ink);border-bottom-right-radius:6px}
.bot{justify-self:start;width:min(100%,640px);display:grid;gap:10px}
.bot .answer{background:var(--surface);border:1px solid var(--line);border-radius:18px;border-bottom-left-radius:6px;padding:14px 16px;white-space:pre-wrap}
.bot .meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:.875rem;align-items:center}
.bot .meta span,.bot .meta button{display:inline-flex;gap:6px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;max-width:100%;padding:6px 14px;border:2px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer;font-size:.9375rem;font-weight:600;text-align:left}
.chip:hover{border-color:var(--accent)}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cites-l{font-size:.875rem;color:var(--muted);font-weight:600}
.urgent{border:3px solid var(--bad);background:var(--bad-soft);border-radius:var(--r);padding:16px;display:grid;gap:8px}
.urgent h3{display:flex;gap:10px;align-items:center;color:var(--bad);font-size:1.25rem}
.urgent p{font-size:1.125rem;font-weight:600}
.change{border:2px dashed var(--accent);border-radius:var(--r);padding:14px;background:var(--surface);display:grid;gap:10px}
.change .acts{display:flex;gap:10px;flex-wrap:wrap}
.change .st{display:flex;gap:8px;align-items:center;font-weight:600}
.starters{display:grid;gap:10px;margin:8px 0 18px}
.starters .chip{border-radius:14px;min-height:52px;padding:10px 16px;white-space:normal}
.starters .chip span{white-space:normal}
.composer{position:sticky;bottom:var(--navoff);background:var(--bg);padding:10px 0 6px;border-top:1px solid var(--line);margin:0 -2px}
.composer form{display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:52px;max-height:9rem;flex:1;resize:none;padding:12px 14px}
.composer .btn{min-height:52px}
.disclaimer{display:flex;gap:6px;align-items:center;justify-content:center;color:var(--muted);font-size:.8125rem;padding-top:6px}
.typing{color:var(--muted);display:flex;gap:8px;align-items:center}
.dots i{display:inline-block;width:8px;height:8px;margin-right:3px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite both}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* lists */
.list{display:grid;gap:10px}
.row{display:flex;gap:12px;align-items:center;width:100%;min-height:64px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-align:left;cursor:pointer}
button.row:hover{border-color:var(--accent)}
.row .ic{flex:none;width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.row .ic svg{width:24px;height:24px}
.row .tx{flex:1;min-width:0;display:grid;gap:2px}
.row .tt{font-weight:650;line-height:1.35}
.row .mt{color:var(--muted);font-size:.9375rem}
.mhead{position:sticky;top:var(--top-h);z-index:5;background:var(--bg);padding:10px 0 6px;font-size:1rem;font-weight:700;color:var(--muted);margin:0}
.item{display:grid;gap:4px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.item .top{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.item .name{font-weight:700;font-size:1.0625rem}
.item .acts{display:flex;gap:6px;flex-shrink:0}
.when{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap;font-weight:600;color:var(--accent)}
.nw{white-space:nowrap}
.soon{font-weight:700;color:var(--warn)}
.next{display:grid;gap:10px;background:var(--accent-soft);border-color:var(--accent)}
.next li{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.next .d{font-weight:700}
.recbody{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;line-height:1.7}

/* trust */
.mandate{display:grid;gap:8px}
.mandate .stt{display:inline-flex;gap:6px;align-items:center;font-weight:700}
.mandate .stt.active{color:var(--ok)}
.mandate .stt.off{color:var(--muted)}
.scopes li{display:flex;gap:10px;align-items:flex-start;margin:4px 0}
.scopes svg{margin-top:.25em;color:var(--accent)}
.feed{display:grid;gap:10px}
.rc{display:grid;gap:4px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);border-left-width:6px}
.rc.e-none{border-left-color:var(--ok)}
.rc.e-local{border-left-color:var(--info)}
.rc.e-private,.rc.e-cloud{border-left-color:var(--warn);background:var(--warn-soft)}
.rc .ts{color:var(--muted);font-size:.875rem}
.rc .what{font-weight:600}
.rc .eg{display:inline-flex;gap:8px;align-items:center;font-size:.9375rem;font-weight:600}
.rc.e-none .eg{color:var(--ok)}.rc.e-local .eg{color:var(--info)}.rc.e-private .eg,.rc.e-cloud .eg{color:var(--warn)}
.rc .dt{color:var(--muted);font-size:.875rem}

/* dialog, toast, banner */
dialog.dlg{border:0;border-radius:18px;padding:0;max-width:min(520px,calc(100vw - 24px));width:100%;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog.dlg::backdrop{background:rgba(10,15,13,.55)}
.dlg form,.dlg .inner{padding:20px;display:grid;gap:14px}
.dlg .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
#toast{position:fixed;left:12px;right:12px;bottom:calc(var(--navoff) + 12px);z-index:60;display:grid;justify-items:center;pointer-events:none}
#toast div{background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;max-width:520px;box-shadow:0 6px 24px rgba(0,0,0,.3)}
@media (min-width:900px){#toast{left:230px}}
#idle{position:sticky;top:var(--top-h);z-index:29;background:var(--warn-soft);border-bottom:2px solid var(--warn);padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
@media (min-width:900px){#idle{grid-column:1/-1}}
.center{text-align:center}
.empty{text-align:center;padding:28px 12px;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty svg{width:42px;height:42px;color:var(--accent)}
.loading{padding:30px;text-align:center;color:var(--muted)}
.hero{display:grid;gap:8px;margin-bottom:6px}
.lang-btn{min-height:44px;padding:6px 12px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body class="auth">
<a class="skip" href="#main" id="skip">跳到主要內容</a>
<header id="top" role="banner"></header>
<div id="idle" role="alert" hidden></div>
<main id="main" tabindex="-1" aria-live="off"></main>
<nav id="tabs" aria-label="主選單" hidden></nav>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:20px">這個應用程式需要啟用 JavaScript。 This app needs JavaScript.</p></noscript>

async function api(method, path, body) {
  const headers = {};
  if (method !== 'GET') headers['Content-Type'] = 'application/json';
  if (S.csrf) headers['X-CSRF-Token'] = S.csrf;
  let res;
  try {
    res = await fetch(path, { method, headers, credentials: 'same-origin', cache: 'no-store', body: method === 'GET' ? undefined : JSON.stringify(body || {}) });
  } catch (e) { return { ok:false, status:0, error:'network', data:null }; }
  let data = null;
  try { data = await res.json(); } catch (e) { /* not json */ }
  const r = { ok: res.ok, status: res.status, data, error: data && data.error, retry: data && data.retry_after, res };
  if (res.status === 401 && r.error === 'locked' && S.unlocked) onLocked('unlock.expired');
  return r;
}

}

      if (!res.ok) { toast(t('err.generic')); return; }
      const blob = await res.blob(); const m = /filename="([^"]+)"/.exec(res.headers.get('Content-Disposition') || '');
      const url = URL.createObjectURL(blob); const a = h('a', { download: m ? m[1] : 'muse-health.musevault' }); a.href = url; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
      toast(t('set.exp.done'));
    } catch (e) { toast(t('err.network')); } finally { exp.disabled = false; }
  } }, icon('download'), t('set.exp.go'));
  /* delete */
  const del = h('button', { class: 'btn danger', type: 'button', onclick: async () => {
    if (!(await confirmDlg(t('set.del.1.h'), t('set.del.1.p'), t('set.del.1.go'), true))) return;
    const ok = await dialog(close => {
      const pw = pwField('del-pw', t('pw.label'), { autocomplete: 'current-password' }); const chk = h('input', { type: 'checkbox', id: 'del-chk' }); const msg = h('div', { 'aria-live': 'assertive' });
      return h('form', { novalidate: true, onsubmit: async ev => {
        ev.preventDefault(); msg.replaceChildren();
        if (!pw.inp.value || !chk.checked) { msg.replaceChildren(h('div', { class: 'err', role: 'alert' }, icon('alert'), t('set.del.2.p'))); return; }
        const r = await api('POST', '/api/vault/delete', { passphrase: pw.inp.value, confirm: true }); pw.inp.value = '';
        if (!r.ok) { msg.replaceChildren(h('div', { class: 'err', role: 'alert' }, icon('alert'), r.error === 'rate_limited' ? errText(r) : t('set.del.fail'))); return; }
        close(true);
      } }, h('h2', { text: t('set.del.2.h') }), h('p', { text: t('set.del.2.p') }), pw.wrap, h('label', { class: 'check', for: 'del-chk' }, chk, h('span', { text: t('set.del.2.chk') })), msg,
        h('div', { class: 'acts' }, h('button', { class: 'btn', type: 'button', onclick: () => close(false), text: t('cancel') }), h('button', { class: 'btn danger solid', type: 'submit', text: t('set.del.2.go') })));
    }, t('set.del.2.h'));
    if (ok) { stopSessionWatch(); S.st.vault_exists = false; onLocked('unlock.deleted'); S.notice = ''; await loadState(); render(true); }
  } }, icon('trash'), t('set.del.go'));
  const sec = (id, title, ...kids) => h('section', { class: 'card stack', 'aria-labelledby': id }, h('h2', { id, text: title }), ...kids);
  const about = [[t('about.tenant'), tn.display_name + '（' + t('about.issuer.' + tn.issuer) + '）'], [t('about.pilot'), tn.pilot_ref || t('about.none')], [t('about.contact'), tn.contact || t('about.none')], [t('about.consent'), tn.consent_version], [t('about.version'), S.st.version]];
  return h('div', { class: 'stack' }, pageHead(t('set.title')),
    sec('s-lang', t('set.lang.h'), h('div', null, langSeg)),
    sec('s-idle', t('set.idle.h'), h('p', { class: 'muted', text: t('set.idle.p') }), fld('idle-sel', t('set.idle.l'), sel)),
    sec('s-pw', t('set.pw.h'), pform),
    sec('s-exp', t('set.exp.h'), h('p', { text: t('set.exp.p') }), h('div', null, exp)),
    sec('s-lock', t('set.lock.h'), h('p', { class: 'muted', text: t('set.lock.p') }), h('div', null, h('button', { class: 'btn', type: 'button', onclick: lockNow }, icon('lock'), t('lock.now')))),
    sec('s-del', t('set.del.h'), h('p', { text: t('set.del.p') }), h('div', null, del)),
    sec('s-about', t('about.h'), h('dl', { class: 'kv' }, about.flatMap(([k, v]) => [h('dt', { text: k }), h('dd', { text: v })])), h('p', { class: 'muted small', text: t('about.note') })));
}

/* ====================================================================== boot */
(async function boot() {
  renderChrome();
  await render(true);
  if (S.unlocked) startSessionWatch();
})();
</script>
