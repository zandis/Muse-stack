[project]
name = "muse-stack"
version = "0.0.0"
description = "Muse stack, including a draft-only AgentMail adapter."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["muse*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
