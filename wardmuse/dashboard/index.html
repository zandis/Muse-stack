<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Wardmuse - your AI resources</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#f3f4f1; --surface:#ffffff; --surface2:#eef0ec; --ink:#1a211f; --muted:#56615c; --line:#d9ded8;
  --accent:#0b6a61; --ok:#12713c; --warn:#8f5000; --bad:#b3261e; --info:#2456a4;
  --tip-bg:#1a211f; --tip-ink:#f3f4f1;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#111614; --surface:#191f1c; --surface2:#222a26; --ink:#e7ece9; --muted:#9aa7a1; --line:#2c3530;
    --accent:#4fd1c0; --ok:#5fd08c; --warn:#ecb04a; --bad:#ff8378; --info:#8ab4ff;
    --tip-bg:#e7ece9; --tip-ink:#111614;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
h1,h2,h3,p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:var(--surface);padding:8px 12px;border-radius:6px;z-index:50}
.skip:focus{top:8px}
svg.i{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em}

/* header */
.top{padding:18px 0 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.title-row h1{font-size:1rem;font-weight:700;letter-spacing:.02em}
.title-row .sub{color:var(--muted);font-size:.875rem}
.spacer{flex:1 1 auto}
.updated{color:var(--muted);font-size:.8125rem}
.btn{font:inherit;font-size:.8125rem;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:7px;padding:5px 10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--muted)}
.btn.tiny{padding:2px 8px;font-size:.75rem}
.btn[aria-busy="true"] svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.summary{font-size:clamp(1.3rem,3.6vw,1.85rem);font-weight:650;line-height:1.2;margin:12px 0 10px;letter-spacing:-.01em}
.summary .part{color:var(--muted);font-weight:500}
.summary .part.warn{color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:3px 11px 3px 9px;font:inherit;font-size:.8125rem;color:var(--ink)}
button.chip,button.badge{cursor:help}
.chip.ok{color:var(--ok)} .chip.bad{color:var(--bad);border-color:currentColor} .chip.warn{color:var(--warn)}
.chip b{font-weight:650}

/* banners */
.alerts{display:grid;gap:10px;margin-top:16px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);border-left-width:4px}
.banner svg.i{margin-top:.25em;font-size:1.05em}
.banner.warn{border-left-color:var(--warn)} .banner.bad{border-left-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--surface))}
.banner.info{border-left-color:var(--info)}
.banner .grow{flex:1;min-width:0}
.banner strong{display:block}

main{padding-bottom:24px}
section{margin-top:26px}
h2{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:10px;display:flex;gap:8px;align-items:baseline}
h2{flex-wrap:wrap}
h2 .count{font-weight:500;letter-spacing:0}
.group+.group{margin-top:20px}
.group h3{font-size:.9rem;font-weight:650;margin-bottom:8px;display:flex;align-items:center;gap:7px}
.group h3 .note{color:var(--muted);font-weight:400;font-size:.8125rem}

/* aliases */
.aliases{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px}
.alias{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.alias.none{border-color:var(--warn)}
.alias .a-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.alias .a-name{font-weight:650}
.alias .a-mode{color:var(--muted);font-size:.75rem}
.alias .a-count{font-size:1.5rem;font-weight:650;line-height:1.2;margin-top:2px}
.alias .a-count small{font-size:.8125rem;font-weight:500;color:var(--muted)}
.pips{display:flex;gap:3px;margin:4px 0 6px;flex-wrap:wrap}
.pip{width:10px;height:6px;border-radius:2px;background:var(--ok)}
.pip.off{background:transparent;box-shadow:inset 0 0 0 1px var(--muted)}
.alias .a-next{font-size:.78rem;color:var(--muted)}
.alias .a-next code,.alias .a-next b{color:var(--ink);font-family:var(--mono);font-size:.75rem;font-weight:500}
.alias .a-warn{font-size:.8125rem;color:var(--warn);display:flex;gap:5px;align-items:center}

/* provider cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--stripe,var(--line));border-radius:10px;padding:13px 14px 12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.s-ok{--stripe:var(--ok)} .card.s-cooling{--stripe:var(--warn)} .card.s-exhausted{--stripe:var(--bad)}
.card.s-no_key,.card.s-disabled,.card.s-unknown{--stripe:var(--muted)}
.card.compact{gap:8px}
.c-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.c-name{font-size:1.05rem;font-weight:700;margin-right:2px}
.tier{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 6px}
.pill{margin-left:auto;display:inline-flex;gap:5px;align-items:center;font-size:.8125rem;font-weight:600}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)} .pill.muted{color:var(--muted)}
.c-policy{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.8125rem}
.badge{display:inline-flex;gap:5px;align-items:center;font:inherit;font-size:.78rem;font-weight:600;border-radius:6px;padding:2px 8px 2px 6px;border:1px solid var(--line);background:var(--surface2);color:var(--ink)}
.badge.local{color:var(--ok)} .badge.safe{color:var(--ok)} .badge.bad{color:var(--bad)} .badge.unk{color:var(--muted)}
.c-policy a{font-size:.78rem}
.blocked{display:grid;gap:2px;background:color-mix(in srgb,var(--warn) 10%,transparent);border-radius:8px;padding:8px 10px}
.blocked.bad{background:color-mix(in srgb,var(--bad) 9%,transparent)}
.blocked .b-line{display:flex;gap:6px;align-items:center;font-weight:650}
.blocked.bad .b-line{color:var(--bad)} .blocked .b-line{color:var(--warn)}
.blocked .b-why{font-size:.8125rem;color:var(--ink)}
.nudge{display:flex;gap:7px;align-items:flex-start;font-size:.8125rem;color:var(--info);background:color-mix(in srgb,var(--info) 9%,transparent);border-radius:8px;padding:6px 10px}
.nudge svg{margin-top:.2em}
.meters{display:grid;gap:9px}
.meter .m-top{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;color:var(--muted)}
.meter .m-label{color:var(--ink);font-weight:600}
.m-src{display:inline-flex;gap:4px;align-items:center}
.bar{height:8px;border-radius:5px;background:var(--surface2);margin:4px 0;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.fill{height:100%;border-radius:5px;background:var(--ok);transition:width .4s}
.meter.mid .fill{background:var(--warn)} .meter.low .fill{background:var(--bad)}
.meter.est .bar{background:transparent;box-shadow:inset 0 0 0 1px var(--muted);border-radius:5px}
.meter.est .fill{background:repeating-linear-gradient(135deg,var(--ok) 0 4px,transparent 4px 7px);background-color:transparent}
.meter.est.mid .fill{background:repeating-linear-gradient(135deg,var(--warn) 0 4px,transparent 4px 7px)}
.meter.est.low .fill{background:repeating-linear-gradient(135deg,var(--bad) 0 4px,transparent 4px 7px)}
.meter .m-bot{display:flex;justify-content:space-between;gap:8px;font-size:.8125rem;flex-wrap:wrap}
.meter .m-num b{font-weight:650}
.meter .m-flag{font-weight:650;margin-left:4px}
.meter.mid .m-flag{color:var(--warn)} .meter.low .m-flag{color:var(--bad)}
.m-reset{color:var(--muted)}
.m-plain{font-size:.8125rem;color:var(--muted)}
.usage{font-size:.8125rem;color:var(--muted)}
.usage b{color:var(--ink);font-weight:600}
.deps{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.dep{display:inline-flex;flex-wrap:wrap;gap:3px 5px;align-items:center;border:1px solid var(--line);background:var(--surface2);border-radius:7px;padding:2px 7px;font-size:.75rem;max-width:100%}
.dep .dep-id{font-family:var(--mono);font-size:.72rem;overflow-wrap:anywhere}
.dep span{white-space:nowrap}.dep .dep-id{white-space:normal}
.dep.cooling{color:var(--warn);border-color:currentColor} .dep.exhausted{color:var(--bad);border-color:currentColor}
.dep.no_key,.dep.disabled,.dep.unknown{color:var(--muted);border-style:dashed}
.dep.ok svg{color:var(--ok)}
.dep .dep-id{color:var(--ink)}
.tag{white-space:nowrap;font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface);border-radius:4px;padding:0 4px;border:1px solid var(--line)}
.cmd{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:6px 6px 6px 10px}
.cmd code{font-family:var(--mono);font-size:.8125rem;overflow-wrap:anywhere;user-select:all}
.hint{font-size:.8125rem;color:var(--muted)}
.hint code,.hint2 code{font-family:var(--mono);font-size:.78rem;background:var(--surface2);padding:0 4px;border-radius:4px}

/* apps, paid cap, queue */
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px;align-items:start}
.prio{display:inline-flex;gap:5px;align-items:center;font-size:.72rem;font-weight:650;text-transform:uppercase;letter-spacing:.05em;border-radius:5px;padding:0 6px;border:1px solid currentColor}
.prio.interactive{color:var(--accent)} .prio.normal{color:var(--muted)} .prio.background{color:var(--info)}
.big{font-size:1.5rem;font-weight:650;line-height:1.15}
.big small{font-size:.8125rem;font-weight:500;color:var(--muted)}
.turned{display:grid;gap:3px;font-size:.8125rem;background:color-mix(in srgb,var(--warn) 9%,transparent);border-radius:8px;padding:7px 10px}
.turned b{color:var(--warn);font-weight:650}
.turned ul{list-style:none;margin:0;padding:0;display:grid;gap:1px}
.facts{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.8125rem;color:var(--muted)}
.facts b{color:var(--ink);font-weight:600}
.s-paused{--stripe:var(--warn)}

/* recent */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
table.calls{width:100%;border-collapse:collapse;font-size:.8125rem}
.calls th{text-align:left;font-weight:600;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.calls td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.calls tr:last-child td{border-bottom:0}
.calls .num{text-align:right;white-space:nowrap}
.calls .when{white-space:nowrap}
.calls .when small{display:block;color:var(--muted);font-size:.72rem}
.route code{font-family:var(--mono);font-size:.78rem}
.route .arrow{color:var(--muted);margin:0 3px}
.route .prov{color:var(--muted)}
.res{white-space:nowrap;font-weight:600}
.res.ok{color:var(--ok)} .res.bad{color:var(--bad)}
.res small{font-weight:400;color:var(--muted)}
.pv{display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
tr.concern{background:color-mix(in srgb,var(--bad) 10%,transparent);box-shadow:inset 4px 0 0 var(--bad)}
.concern-note{display:flex;gap:6px;align-items:flex-start;color:var(--bad);font-weight:600;margin-top:3px;font-size:.78rem}
.concern-note svg{margin-top:.2em}
.empty{padding:18px 16px;color:var(--muted)}
.empty strong{display:block;color:var(--ink);margin-bottom:2px}
.empty code{font-family:var(--mono);font-size:.8125rem;background:var(--surface2);padding:1px 5px;border-radius:4px;color:var(--ink)}

/* onboarding */
.steps{counter-reset:s;list-style:none;margin:8px 0 0;padding:0;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.steps li{counter-increment:s;position:relative;padding-left:34px;font-size:.875rem}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--bg);font-weight:700;font-size:.8125rem;display:grid;place-items:center}
.steps li b{display:block}
.steps .cmd{margin-top:4px}

/* add a helper, other allowances, subscriptions */
.addlist{list-style:none;margin:0;padding:0;display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr))}
.addrow{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;gap:12px;min-width:0}
.addrow.first{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.rank{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--bg);font-weight:700;font-size:.8125rem;display:grid;place-items:center}
.addrow .body{flex:1;min-width:0;display:grid;gap:6px}
.addrow .nm-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.addrow .nm{font-weight:700;font-size:1rem}
.best{display:inline-flex;gap:4px;align-items:center;font-size:.72rem;font-weight:650;text-transform:uppercase;letter-spacing:.05em;color:var(--ok);border:1px solid currentColor;border-radius:5px;padding:0 6px}
.meta{color:var(--muted);font-size:.8125rem}
.gain{font-size:.875rem;font-weight:600}
.gain.unk{color:var(--muted);font-weight:400}
.conn{display:flex;gap:6px;align-items:center;font-size:.8125rem;color:var(--ink)}
.conn svg{color:var(--accent)}
.fine{color:var(--muted);font-size:.75rem}
details.other{background:var(--surface);border:1px solid var(--line);border-radius:10px}
details.other>summary{cursor:pointer;list-style:none;padding:11px 14px;font-weight:650;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
details.other>summary::-webkit-details-marker{display:none}
details.other>summary::after{content:"\25B8";margin-left:auto;color:var(--muted);transition:transform .15s}
details.other[open]>summary::after{transform:rotate(90deg)}
details.other .inner{padding:0 14px 12px;display:grid;gap:10px}
.minis{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.mini{display:grid;gap:3px;border-top:1px solid var(--line);padding-top:10px;min-width:0}
.mini .m-head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.mini .m-name{font-weight:650}
.mini .m-line{font-size:.875rem}
.mini a{font-size:.8125rem}
.kindhead{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:4px}
.sublist{display:grid;gap:0}
footer{border-top:1px solid var(--line);padding:16px 0 28px;color:var(--muted);font-size:.8125rem}
footer p+p{margin-top:4px}
footer code{font-family:var(--mono);font-size:.78rem}

.tip{position:fixed;z-index:100;max-width:min(340px,calc(100vw - 16px));background:var(--tip-bg);color:var(--tip-ink);border-radius:8px;padding:8px 11px;font-size:.8125rem;line-height:1.4;white-space:pre-line;box-shadow:0 6px 24px rgba(0,0,0,.25);visibility:hidden;pointer-events:none}
.tip.show{visibility:visible}

@media (max-width:719px){
  .calls thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .calls,.calls tbody{display:block}
  .calls tr{display:grid;grid-template-columns:1fr auto auto;grid-template-areas:"route route result" "when lat tok" "pv pv pv";gap:2px 12px;padding:9px 12px;border-bottom:1px solid var(--line)}
  .calls tr:last-child{border-bottom:0}
  .calls td{display:block;padding:0;border:0}
  .calls td.route{grid-area:route} .calls td.res{grid-area:result;text-align:right}
  .calls td.when{grid-area:when;display:flex;gap:6px;align-items:baseline} .calls td.when small{display:inline}
  .calls td.lat{grid-area:lat} .calls td.tok{grid-area:tok} .calls td.pvc{grid-area:pv;margin-top:2px}
  .calls td.lat,.calls td.tok{color:var(--muted);font-size:.78rem}
  tr.concern{box-shadow:inset 4px 0 0 var(--bad)}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<a class="skip" href="#providers">Skip to providers</a>
<header class="top">
  <div class="wrap">
    <div class="title-row">
      <h1>Wardmuse</h1><span class="sub">your AI resources</span>
      <span class="spacer"></span>
      <span class="updated" id="updated" aria-live="off">Not loaded yet</span>
      <button class="btn" id="refreshBtn" type="button" aria-label="Refresh now"></button>
    </div>
    <p class="summary" id="summary" aria-live="polite">Loading...</p>
    <div class="chips" id="chips"></div>
  </div>
</header>
<main class="wrap" id="main">
  <div class="alerts" id="alerts"></div>
  <div id="app"></div>
</main>
<footer>
  <div class="wrap" id="foot">
    <p>Nothing on this page leaves your machine. It loads no outside scripts, fonts or images and only talks to the server that served it. Links you click, such as a provider's terms, open that provider's own site.</p>
  </div>
</footer>

  help:[['circle',{cx:12,cy:12,r:9}],['path',{d:'M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01'}]],
  alert:[['path',{d:'M12 3l10 18H2z'}],['path',{d:'M12 10v5M12 18h.01'}]],
  shield:[['path',{d:'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z'}],['path',{d:'M8.5 12l2.5 2.5 4.5-5'}]],
  monitor:[['rect',{x:3,y:4,width:18,height:12,rx:2}],['path',{d:'M8 20h8M12 16v4'}]],
  eye:[['path',{d:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z'}],['circle',{cx:12,cy:12,r:3}]],
  dot:[['circle',{cx:12,cy:12,r:4}]],
  refresh:[['path',{d:'M20 11a8 8 0 1 0-2.3 5.7'}],['path',{d:'M20 4v7h-7'}]],

  pulse:[['path',{d:'M3 12h4l2-6 4 12 2-6h6'}]],

/* ---------- render ---------- */
var snap = null, lastOkAt = null, lastErr = null, lastKey = '', inflight = false;
var DEMO = new URLSearchParams(location.search).get('demo') === '1';
var API = '/api/status' + (DEMO ? '?demo=1' : '');

function banner(kind, ic, title, body, extra) {
  return h('div', {class: 'banner ' + kind, role: kind === 'bad' ? 'alert' : 'status'}, icon(ic),
    h('div', {class: 'grow'}, h('strong', {text: title}), body ? h('span', {text: body}) : null, extra || null));
}

function render() {
  var key = JSON.stringify([snap && Object.assign({}, snap, {generated_at: 0}), lastErr, DEMO]);
  tickUpdated();
  if (key === lastKey) return;
  lastKey = key;
  var fk = document.activeElement && document.activeElement.getAttribute && document.activeElement.getAttribute('data-fk');
  hideTip();
  try { renderBody(); }
  catch (e) {
    $('alerts').replaceChildren(banner('bad', 'alert', 'This page could not read the status data.', 'The snapshot has an unexpected shape. Refresh, or run muse status in a terminal.'));
    $('app').replaceChildren(); $('chips').replaceChildren();
    $('summary').textContent = 'Status unreadable';
  }
  if (fk) { var n = document.querySelector('[data-fk="' + fk.replace(/["\\]/g, '\\$&') + '"]'); if (n) n.focus({preventScroll: true}); }
}

function tickUpdated() {
  var u = $('updated');
  if (lastOkAt) { u.replaceChildren('Updated ' + new Date(lastOkAt).toLocaleTimeString() + ' (', h('span', {id: 'ageNote', text: fmtAgo(Date.now() - lastOkAt)}), ')'); }

}

function renderBody() {
  var alerts = [], app = $('app');
  if (DEMO) alerts.push(banner('info', 'eye', 'Demo data.', ' This is an example, not your setup. Times are shifted to look current.',
    h('a', {href: '/', text: ' Show my own status', style: 'margin-left:6px'})));
  if (lastErr) {
    if (snap) {
      alerts.push(banner('warn', 'wifi', 'Showing the last good data, which may be out of date.',
        ' ' + lastErr.error + (lastErr.hint ? ' ' + lastErr.hint : '') + ' Will keep trying every 10 s.'));
    } else {
      alerts.push(banner('bad', 'alert', lastErr.title, ' ' + lastErr.error + (lastErr.hint ? ' ' + lastErr.hint : '')));
      app.replaceChildren(h('div', {class: 'panel', style: 'margin-top:16px'}, h('div', {class: 'empty'},
        h('strong', {text: 'Nothing to show yet'}), 'The dashboard is running but cannot read your status. It retries every 10 s, or press Refresh.')));
      $('alerts').replaceChildren.apply($('alerts'), alerts);
      $('summary').textContent = 'Status unavailable'; $('chips').replaceChildren();
      document.title = 'Wardmuse - status unavailable';
      return;
    }
  }
  var providers = Array.isArray(snap.providers) ? snap.providers : [];
  var aliases = Array.isArray(snap.aliases) ? snap.aliases : [];
  var recent = Array.isArray(snap.recent) ? snap.recent : [];
  var byId = {}, depProv = {};
  providers.forEach(function (p) { byId[p.id] = p; (p.deployments || []).forEach(function (d) { depProv[d.id] = p.id; }); });

  var groups = {ready: [], resting: [], unknown: [], no_key: [], disabled: []};
  providers.forEach(function (p) { groups[groupOf(p)].push(p); });
  var byName = function (a, b) { return String(a.id).localeCompare(String(b.id)); };
  groups.ready.sort(function (a, b) {
    var ra = a.kind === 'local' ? 0 : (TIER_RANK[a.tier] != null ? TIER_RANK[a.tier] : 5), rb = b.kind === 'local' ? 0 : (TIER_RANK[b.tier] != null ? TIER_RANK[b.tier] : 5);
    return ra - rb || byName(a, b);

  groups.resting.sort(function (a, b) {

    return ta === tb ? byName(a, b) : ta < tb ? -1 : 1;

  /* header summary */
  var total = providers.length;
  var parts = [h('span', {text: groups.ready.length + ' of ' + total + ' ' + plural(total, 'provider', 'providers') + ' ready'})];
  if (groups.resting.length) parts.push(h('span', {class: 'part warn', text: ' \u00b7 ' + groups.resting.length + ' resting'}));
  if (groups.no_key.length) parts.push(h('span', {class: 'part', text: ' \u00b7 ' + groups.no_key.length + ' ' + plural(groups.no_key.length, 'needs', 'need') + ' a key'}));
  if (groups.unknown.length) parts.push(h('span', {class: 'part', text: ' \u00b7 ' + groups.unknown.length + ' not seen yet'}));
  if (groups.disabled.length) parts.push(h('span', {class: 'part', text: ' \u00b7 ' + groups.disabled.length + ' off'}));
  $('summary').replaceChildren.apply($('summary'), total ? parts : [h('span', {text: 'No providers in this snapshot'})]);
  document.title = 'Wardmuse - ' + groups.ready.length + '/' + total + ' ready';

  var dp = String(snap.default_privacy || 'unknown'), dpi = PRIVACY[dp] || {icon: 'help', text: 'Unrecognised privacy class.'};
  var chips = [];
  chips.push(withTip(h('button', {class: 'chip', type: 'button', 'data-fk': 'chip:privacy'}, icon(dpi.icon), 'Default privacy: ', h('b', {text: str(dp, 20)})), dpi.text));
  var px = snap.proxy || {}, pu = str(px.url, 80);
  chips.push(px.reachable === true ? h('span', {class: 'chip ok'}, icon('check'), 'Proxy reachable', pu ? [' \u00b7 ', h('span', {text: pu})] : null)
    : px.reachable === false ? h('span', {class: 'chip bad'}, icon('ban'), 'Proxy not reachable', pu ? [' \u00b7 ', h('span', {text: pu})] : null)
    : h('span', {class: 'chip'}, icon('help'), 'Proxy not checked', pu ? [' \u00b7 ', h('span', {text: pu})] : null));
  var tt = snap.totals || {};
  if (tt.requests_today != null || tt.tokens_today != null)
    chips.push(h('span', {class: 'chip'}, icon('pulse'), 'Today ', h('b', {text: fmtInt(tt.requests_today)}), plural(tt.requests_today, ' request', ' requests'),
      ' \u00b7 ', h('b', {text: fmtCompact(tt.tokens_today)}), ' tokens'));
  if (snap.paid && typeof snap.paid.spent_usd === 'number')
    chips.push(h('span', {class: 'chip' + (snap.paid.cap_usd > 0 && snap.paid.spent_usd >= snap.paid.cap_usd ? ' bad' : '')}, icon('coin'), 'Paid ', h('b', {text: fmtUsd(snap.paid.spent_usd)}),
      snap.paid.cap_usd > 0 ? ' of ' + fmtUsd(snap.paid.cap_usd) : ' (off)'));
  if (snap.paused) chips.push(h('span', {class: 'chip warn'}, icon('pause'), 'Queue paused'));
  $('chips').replaceChildren.apply($('chips'), chips);

  /* alerts: policy concerns first */
  var nConcern = recent.filter(function (c) { return concernOf(c, byId); }).length;
  if (nConcern) alerts.unshift(banner('bad', 'alert', nConcern + ' recent ' + plural(nConcern, 'call', 'calls') + ' went against your privacy setting.',
    ' A request marked private or local was served by a provider that is not on this machine and not confirmed as non-training. See Recent calls.'));
  if (snap.proxy && snap.proxy.reachable === false)
    alerts.push(banner('warn', 'wifi', 'The proxy is not reachable.', ' Clients pointed at ' + str(snap.proxy.url, 80) + ' will fail until it is running.'));

  if (snap.paused) alerts.unshift(banner('warn', 'pause', 'Paused.', ' The background queue is stopped and sends nothing. Your apps and the proxy keep working. Run muse resume to continue.'));

  /* onboarding when nothing is set up */
  var anyKey = providers.some(function (p) { return p.configured !== false && p.enabled !== false; });
  var firstFree = providers.filter(function (p) { return p.kind !== 'local' && p.key_env; }).sort(function (a, b) {
    return (TIER_RANK[a.tier] != null ? TIER_RANK[a.tier] : 5) - (TIER_RANK[b.tier] != null ? TIER_RANK[b.tier] : 5);
  })[0];
  var sections = [];
  if (!anyKey) {
    sections.push(h('section', {'aria-labelledby': 'h-start'},
      h('h2', {id: 'h-start', text: 'Getting started'}),
      h('div', {class: 'panel', style: 'padding:14px 16px'},
        h('p', {text: 'No provider is set up yet, so nothing can answer. Three steps:'}),
        h('ol', {class: 'steps'},
          h('li', {}, h('b', {text: 'Pick a provider'}), 'Start with one marked free below, and create an API key on its website.'),
          h('li', {}, h('b', {text: 'Store the key'}), firstFree ? ['Run this in a terminal:', cmdBlock('muse keys set ' + firstFree.key_env)] : 'Use muse keys set with the provider\'s key name.'),
          h('li', {}, h('b', {text: 'Send a request'}), 'Point any OpenAI-compatible client at ' + (str(px.url, 80) || 'the proxy') + ' and use the model name ', h('code', {text: 'fast'}), '. This page then fills in.')))));
  }

  /* paid cap and queue */
  var pq = [];
  if (snap.paid && typeof snap.paid === 'object') pq.push(paidCard(snap.paid));
  if (snap.queue && typeof snap.queue === 'object') pq.push(queueCard(snap.queue, !!snap.paused));
  if (pq.length) sections.push(h('section', {'aria-labelledby': 'h-pq'}, h('h2', {id: 'h-pq', text: 'Spending and queue'}), h('div', {class: 'pair'}, pq)));

  /* aliases */
  var order = ['fast', 'cheap', 'smart', 'long-context', 'embed', 'rerank'];
  var sortedAliases = aliases.slice().sort(function (a, b) {
    var ia = order.indexOf(a.name), ib = order.indexOf(b.name);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });
  if (sortedAliases.length) sections.push(h('section', {'aria-labelledby': 'h-alias'},
    h('h2', {id: 'h-alias', text: 'Aliases'}),
    h('div', {class: 'aliases'}, sortedAliases.map(function (a) { return aliasCard(a, depProv); }))));

  /* apps */
  var appRows = (Array.isArray(snap.apps) ? snap.apps : []).filter(function (a) {
    return !(a.name === 'anonymous' && !(a.today && a.today.requests) && !Object.keys(a.deferrals || {}).length);
  });
  if (appRows.length) sections.push(h('section', {id: 'apps', 'aria-labelledby': 'h-apps'},
    h('h2', {id: 'h-apps'}, 'Apps', h('span', {class: 'count', text: appRows.length + ' using this proxy'})),
    h('div', {class: 'cards'}, appRows.map(appCard))));

  /* providers */
  var gdefs = [
    ['ready', 'Ready', 'check', 'can take requests now'],
    ['resting', 'Resting', 'clock', 'soonest back first'],
    ['unknown', 'Not seen yet', 'help', 'configured, no calls yet'],
    ['no_key', 'Needs a key', 'key', ''],
    ['disabled', 'Disabled', 'power', '']
  ];
  var pg = gdefs.filter(function (g) { return groups[g[0]].length; }).map(function (g) {
    var list = groups[g[0]];
    return h('div', {class: 'group'},
      h('h3', {}, icon(g[2]), g[1] + ' (' + list.length + ')', g[3] ? h('span', {class: 'note', text: g[3]}) : null),
      h('div', {class: 'cards'}, list.map(providerCard)));
  });
  sections.push(h('section', {id: 'providers', 'aria-labelledby': 'h-prov'},
    h('h2', {id: 'h-prov', text: 'Providers'}),
    pg.length ? pg : h('div', {class: 'panel'}, h('div', {class: 'empty'}, h('strong', {text: 'No providers'}), 'The snapshot lists no providers.'))));

  /* catalogue v2: what to add next, allowances outside AI, subscriptions */
  if (Array.isArray(snap.suggestions)) sections.push(addHelperSection(snap.suggestions));
  var oa = otherSection(Array.isArray(snap.resources) ? snap.resources : []);
  if (oa) sections.push(oa);
  var ss = subscriptionsSection(Array.isArray(snap.subscriptions) ? snap.subscriptions : []);
  if (ss) sections.push(ss);

  /* recent calls */
  var recentBody;
  if (!recent.length) {
    recentBody = h('div', {class: 'empty'}, h('strong', {text: 'No calls yet'}),
      'Point an OpenAI-compatible client at ' + (str(px.url, 80) || 'the proxy') + ' and ask for the model ', h('code', {text: 'fast'}), '. Each call shows up here, with where it went and whether your privacy setting allowed it.');
  } else {
    recentBody = h('table', {class: 'calls'},
      h('caption', {class: 'sr', text: 'Recent calls, newest first'}),
      h('thead', {}, h('tr', {}, ['When', 'Alias \u2192 deployment (provider)', 'Result', 'Latency', 'Tokens in \u2192 out', 'Privacy'].map(function (t, i) {
        return h('th', {scope: 'col', class: i === 3 || i === 4 ? 'num' : '', text: t, style: i === 3 || i === 4 ? 'text-align:right' : null});
      }))),
      h('tbody', {}, recent.map(function (c) { return callRow(c, byId); })));
  }
  sections.push(h('section', {'aria-labelledby': 'h-recent'},
    h('h2', {id: 'h-recent'}, 'Recent calls', recent.length ? h('span', {class: 'count', text: 'newest first'}) : null),
    h('div', {class: 'panel'}, recentBody)));

  $('alerts').replaceChildren.apply($('alerts'), alerts);
  app.replaceChildren.apply(app, sections);

  var foot = $('foot');
  foot.replaceChildren(
    snap.home ? h('p', {}, 'State is stored in ', h('code', {text: str(snap.home, 200)}), ' on this machine.') : null,
    h('p', {text: 'Nothing on this page leaves your machine. It loads no outside scripts, fonts or images and only talks to the server that served it. Links you click, such as a provider\'s terms, open that provider\'s own site.'}));
}

/* ---------- fetching ---------- */
function setBusy(b) { var btn = $('refreshBtn'); btn.setAttribute('aria-busy', b ? 'true' : 'false'); }
function refresh() {
  if (inflight) return Promise.resolve();
  inflight = true; setBusy(true);
  var ctl = new AbortController(), to = setTimeout(function () { ctl.abort(); }, 8000);
  return fetch(API, {cache: 'no-store', signal: ctl.signal, headers: {Accept: 'application/json'}})
    .then(function (r) {
      return r.json().catch(function () { return null; }).then(function (body) {
        if (!r.ok) {
          lastErr = {title: 'Status is unavailable.', error: str(body && body.error, 200) || ('The server answered ' + r.status + '.'), hint: str(body && body.hint, 300)};
          return;
        }
        if (!body || typeof body !== 'object') { lastErr = {title: 'Status is unavailable.', error: 'The server sent something unexpected.', hint: ''}; return; }
        snap = body; lastOkAt = Date.now(); lastErr = null;
      });
    })
    .catch(function () {
      lastErr = {title: 'Cannot reach the dashboard server.', error: 'The request failed or timed out.', hint: 'Is the dashboard process still running?'};
    })
    .then(function () { clearTimeout(to); inflight = false; setBusy(false); render(); });
}

$('refreshBtn').appendChild(icon('refresh'));
$('refreshBtn').appendChild(document.createTextNode('Refresh'));
$('refreshBtn').addEventListener('click', function () { refresh(); });
setInterval(function () { if (!document.hidden) refresh(); }, 10000);
document.addEventListener('visibilitychange', function () {
  if (!document.hidden && (!lastOkAt || Date.now() - lastOkAt > 10000)) refresh();
});
setInterval(tick, 1000);
refresh();
})();
</script>
</body>
</html>
