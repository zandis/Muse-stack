# Muse stack provider catalog.
#
# scripts/render_config.py turns this file plus the process environment into
# the LiteLLM config. A provider is omitted when its env var is empty or when
# its id is listed in MUSE_DISABLE_PROVIDERS, so a missing key cannot fail
# startup.
#
# join:
#   always          — part of the public alias (fast, smart, ...) whenever the key is set
#   paid_fallback   — joins the public aliases when paid use is on: MUSE_DAILY_PAID_CAP_USD
#                     > 0 (default 1.00) and MUSE_ALLOW_PAID_FALLBACK not false, or
#                     MUSE_ALLOW_PAID_FALLBACK=true. Otherwise direct model name only.
#   With the cap > 0, every tier paid/metered alias entry is rendered at order
#   20 + its own order (or later than the highest free/local order), so free,
#   trial and local deployments are always tried first.
#
# price: optional, per deployment, USD per million tokens:
#     price: {input_per_mtok: 0.02, output_per_mtok: 0.05}
#   The hook (muse/ration.py) uses a paid or metered deployment automatically
#   only when it has a price, and charges calls against the daily paid cap
#   with it. Without a price the deployment stays callable by its direct name
#   (by an app allowed to pay), and those calls are recorded as unknown cost.
#   Prices are not filled in for the providers below: copy them from the
#   provider's own pricing page after checking, never from notes or memory.
#   tier free, trial and local cost 0 by definition.
#
# min_output_tokens: optional, per deployment (chat only), a whole number from 1
#   to 8192; also accepted on the provider as the default for its chat
#   deployments (the deployment's own value wins). A reasoning model spends
#   output tokens on hidden reasoning before it writes anything visible, so a
#   request with a small max_tokens comes back as HTTP 200 with empty content
#   and finish_reason "length". The renderer writes the number as
#   model_info.muse_min_output_tokens and the hook (muse/hook.py) raises a
#   smaller max_tokens / max_completion_tokens / max_output_tokens to it for
#   that one upstream call, reported as `x-muse-min-output: raised:<from>-><to>`.
#   A request that sets no cap is left alone, and nothing is ever lowered.
#   The 1024 used below is NOT from any provider's documentation. It is the
#   owner's observation on real keys: gpt-oss models returned an empty answer at
#   max_tokens 16-20 and a normal one at 300 (2026-11-12/13), and the first
#   skills run (2026-11-13) still got empty answers at the light ceiling of 300.
#   A floor above a task's ceiling wins for that deployment (that is the point),
#   so a light call to these models may use up to 1024 output tokens of the
#   allowance. Set it only on models known to reason before answering.
#
# reasoning: optional, per chat deployment, e.g.
#     reasoning: {param: reasoning_effort, light: low, everyday: low}
#   Asks a reasoning model to think less on the named task tiers. The renderer
#   writes model_info.muse_reasoning; the hook (muse/hook.py) sets the parameter
#   on the upstream call by the request's task when the client did not set it,
#   and answers `x-muse-reasoning: <value>`. Only where the provider documents
#   the parameter for that model AND LiteLLM passes it through for that route
#   (drop_params is on, so a dropped parameter would silently do nothing):
#   checked 2026-11-13 for groq/ and cerebras/ (yes) and nvidia_nim/ and
#   novita/ (LiteLLM 1.108.5 drops reasoning_effort there: no field).
#
# quota: optional, per provider, e.g. {requests_per_month: 1000}. Used by
#   `muse status` and by the reserve rule when the provider reports nothing.
#
# order: lower is tried first inside an alias. Equal orders are load-balanced
# with simple-shuffle, weighted by rpm. rpm values are routing weights, not a
# promise of the provider's real quota.
#
# verified describes what was checked on 2026-11-11. See README for the gaps.
#
# policy: what the privacy classes route on (muse/policy.py). Values are
#   yes | no | unknown. "unknown" is treated as "yes" by the private class, so
#   a provider only receives private prompts once someone has checked its terms
#   and written "no" here. commercial_use is allowed | prohibited | unknown.
#
# kind: local providers have no key. They are enabled when base_env is set
#   (e.g. OLLAMA_API_BASE) and their deployments come from the local catalog
#   written by `muse local discover` (MUSE_LOCAL_CATALOG, default
#   $MUSE_HOME/local.yaml), because the models installed differ per machine.
#
# Catalogue v2 (2026-11-12). Every field below is optional, is checked by
# scripts/validate_config.py (via muse/catalog.py) and is read by `muse connect`,
# `muse status` and the dashboard. The rule for every fact: it was read on the
# provider's own page on `checked_on`, and `source_urls` says which. Anything
# not confirmed is `unknown` and the entry's `confidence` stays L or M. Never
# fill a number from memory.
#   name              display name (a brand, so it is not translated)
#   also_env          more variables the provider needs besides `env` (not secrets
#                     in themselves, e.g. an account id); the provider is off until all are set
#   one_off: true     the allowance never renews (trial credits). The renderer writes
#                     model_info.muse_oneoff (a boolean) on every deployment so the
#                     rationing code can hold it back for jobs that need it.
#   kind_of_allowance daily | monthly | one_off | scarce_strong | abundant_small
#                     (docs/muse-plan.md 5.2). Only what the windows below support.
#   allowance         [{window: minute|day|month|total, limit, unit: requests|tokens|neurons|..,
#                       scope?, condition?, headline?}]. `headline: true` marks the entry that
#                       `muse connect` quotes as "what you gain". No headline: the first
#                       entry that is not per-minute. Do not duplicate `quota:`, which the
#                       rationing code reads.
#   reset             {rule: utc_day|pacific_day|rolling|calendar_month|none|unknown, tz?}
#   read_remaining    {method: headers|api_endpoint|dashboard_only|none|unknown, endpoint?, fields?, note?}
#   connection        {method: oauth_pkce|paste_key|none, auth_url?, exchange_url? (oauth_pkce,
#                       https only), key_url, steps: [{id, title: {en, zh-TW}, detail: {en, zh-TW}}],
#                       card_required|phone_required|usable_on_phone: yes|no|unknown,
#                       minutes_estimate (Muse's own estimate, not measured),
#                       test?: {url, auth: bearer | {header: NAME}} one GET that sends no prompt}
#   good_for          everyday | long_documents | quick_answers | embeddings | reranking,
#                     consistent with the deployments below
#   terms_flags       {one_account_per_person: yes|no|unknown, aggregation_or_reselling:
#                       prohibited|allowed|unknown, automation_of_console: prohibited|allowed|unknown,
#                       hosted_in: <country code>|varies|local|unknown}. Providers hosted in
#                       mainland China carry hosted_in: cn (and policy.region: cn).
#   checked_on        YYYY-MM-DD, never in the future
#   confidence        H (all stated facts read on the provider's pages) | M (the main facts,
#                     some fields unknown) | L (little confirmed)
#   source_urls       the pages the facts were read on

aliases:
  fast:
    mode: chat
    fallbacks: [cheap, smart]
    context_window_fallback: long-context
  cheap:
    mode: chat
    fallbacks: [fast, smart]
    context_window_fallback: long-context
  smart:
    mode: chat
    fallbacks: [cheap, fast]
    context_window_fallback: long-context
  long-context:
    mode: chat
    fallbacks: [smart]
  embed:
    mode: embedding
  rerank:
    mode: rerank

providers:
  - id: gemini
    env: GEMINI_API_KEY
    tier: free
    policy:
      trains_on_inputs: yes
      human_review: yes
      region: us
      commercial_use: allowed
      terms_url: https://aistudio.google.com/docs/terms
      note: "Unpaid tier: Google uses prompts and responses to improve products, human reviewers may read them, and the terms say not to submit sensitive, confidential or personal information. Must be 18+. Apps offered to EEA/UK/CH users must use the paid tier. Outputs may not be used to build competing models."
    key_url: https://aistudio.google.com/apikey
    name: Gemini
    one_off: false
    kind_of_allowance: [daily]
    good_for: [everyday, quick_answers, long_documents, embeddings]
    allowance: []
    reset: {rule: pacific_day, tz: America/Los_Angeles}
    read_remaining:
      method: dashboard_only
      note: "Limits are per project, not per key. Numbers are shown in Google AI Studio and were not copied here. No remaining-quota endpoint was found."
    connection:
      method: paste_key
      key_url: https://aistudio.google.com/apikey
      card_required: unknown
      phone_required: unknown
      minutes_estimate: 4
      usable_on_phone: unknown
      test: {url: https://generativelanguage.googleapis.com/v1beta/models, auth: {header: x-goog-api-key}}
      steps:
        - id: sign-in
          title: {en: "Sign in with your own Google account", zh-TW: "用你自己的 Google 帳號登入"}
          detail: {en: "Muse opens the AI Studio key page (aistudio.google.com/apikey). Sign in with your own Google account there.", zh-TW: "Muse 會打開 AI Studio 的金鑰頁面（aistudio.google.com/apikey）。請在那裡用你自己的 Google 帳號登入。"}
        - id: accept-terms
          title: {en: "Accept the terms", zh-TW: "同意服務條款"}
          detail: {en: "After you accept the terms, AI Studio creates a default project and key for you.", zh-TW: "同意條款後，AI Studio 會自動替你建立預設專案和金鑰。"}
        - id: copy-key
          title: {en: "Copy the key", zh-TW: "複製金鑰"}
          detail: {en: "Copy the key shown on the page, then come back here and paste it when asked.", zh-TW: "複製頁面上的金鑰，再回到這裡，等 Muse 詢問時貼上。"}
    terms_flags: {one_account_per_person: unknown, aggregation_or_reselling: unknown, automation_of_console: unknown, hosted_in: unknown}
    checked_on: "2026-11-12"
    confidence: M
    source_urls:
      - https://aistudio.google.com/docs/rate-limits
      - https://aistudio.google.com/docs/api-key
      - https://aistudio.google.com/docs/quickstart
    notes: >-
      Google AI Studio free tier. The pricing page marks the models below
      "Free of charge" and says free-tier content is used to improve Google's
      products. Numeric RPM/RPD are shown in AI Studio and were not copied here.
    deployments:
      - id: gemini-3.1-flash-lite
        model: gemini/gemini-3.1-flash-lite
        mode: chat
        aliases: [fast, cheap]
        order: 1
        rpm: 10
        context_tokens: 1048576
        join: always
        verified: gemini-pricing-and-litellm-1.108.5
        notes: Free of charge on the Gemini pricing page. 1,048,576-token window is from the LiteLLM 1.108.5 model map.
      - id: gemini-2.5-flash-lite
        model: gemini/gemini-2.5-flash-lite
        mode: chat
        aliases: [cheap]
        order: 1
        rpm: 15
        context_tokens: 1048576
        join: always
        verified: gemini-pricing-and-litellm-1.108.5
        notes: Free of charge. Older Flash-Lite, kept because free-tier quotas are often higher than newer Flash models.
      - id: gemini-3.5-flash-lite
        model: gemini/gemini-3.5-flash-lite
        mode: chat
        aliases: [cheap]
        order: 1
        rpm: 10
        context_tokens: 1048576
        join: always
        verified: gemini-pricing-and-litellm-1.108.5
        notes: Free of charge on the standard tier of the pricing page.
      - id: gemini-3.8-flash
        model: gemini/gemini-3.8-flash
        mode: chat
        aliases: [smart, long-context]
        order: 1
        rpm: 8
        context_tokens: 1048576
        join: always
        verified: gemini-pricing-and-litellm-1.108.5
        notes: Free of charge. Pricing page calls it the most capable Flash model. The 1,048,576 window is from LiteLLM's map; the pricing page did not restate it.
      - id: gemini-2.5-flash
        model: gemini/gemini-2.5-flash
        mode: chat
        aliases: [long-context]
        order: 1
        rpm: 8
        context_tokens: 1048576
        join: always
        verified: gemini-pricing-page
        notes: Free of charge. Pricing page states a 1M token context window.
      - id: gemini-2.5-pro
        model: gemini/gemini-2.5-pro
        mode: chat
        aliases: [smart, long-context]
        order: 2
        rpm: 3
        context_tokens: 1048576
        join: always
        verified: gemini-pricing-and-litellm-1.108.5
        notes: Free of charge, but historically a much tighter daily cap than Flash. Order 2 so Flash and Groq are preferred.
      - id: gemini-embedding-2
        model: gemini/gemini-embedding-2
        mode: embedding
        aliases: [embed]
        order: 1
        rpm: 10
        join: always
        verified: gemini-pricing-and-litellm-1.108.5
        notes: Free of charge for text, image, audio, and video input. Output dimension was not stated on the pricing page. LiteLLM maps max input to 8,192 tokens.

  - id: groq
    env: GROQ_API_KEY
    tier: free
    policy:
      trains_on_inputs: unknown
      human_review: unknown
      region: us
      commercial_use: allowed
      terms_url: https://groq.com/terms-of-use/
      note: "Training and review terms not checked, so the private class skips it. The services agreement bars reselling or leasing access."
    key_url: https://console.groq.com/keys
    name: Groq
    one_off: false
    kind_of_allowance: [daily]
    good_for: [everyday, quick_answers]
    allowance: []
    reset: {rule: unknown}
    read_remaining:
      method: headers
      fields: [x-ratelimit-limit-requests, x-ratelimit-remaining-requests, x-ratelimit-reset-requests, x-ratelimit-limit-tokens, x-ratelimit-remaining-tokens, x-ratelimit-reset-tokens, retry-after]
      note: "Limits apply per organisation. The requests headers are the daily request limit; the tokens headers are the per-minute token limit. Free-plan numbers are only on the console limits page (login)."
    connection:
      method: paste_key
      key_url: https://console.groq.com/keys
      card_required: unknown
      phone_required: unknown
      minutes_estimate: 4
      usable_on_phone: unknown
      test: {url: https://api.groq.com/openai/v1/models, auth: bearer}
      steps:
        - id: open-page
          title: {en: "Open Groq's key page", zh-TW: "打開 Groq 的金鑰頁面"}
          detail: {en: "Muse opens console.groq.com/keys. Sign in, or sign up there if you do not have an account yet.", zh-TW: "Muse 會打開 console.groq.com/keys。請在那裡登入；還沒有帳號的話就先註冊。"}
        - id: create-key
          title: {en: "Create a key", zh-TW: "建立金鑰"}
          detail: {en: "Create a new API key on that page. Muse does not click anything for you.", zh-TW: "在該頁面建立一組新的 API 金鑰。Muse 不會替你點擊任何東西。"}
        - id: copy-key
          title: {en: "Copy the key", zh-TW: "複製金鑰"}
          detail: {en: "Copy it, then come back here and paste it when asked.", zh-TW: "複製後回到這裡，等 Muse 詢問時貼上。"}
    terms_flags: {one_account_per_person: unknown, aggregation_or_reselling: prohibited, automation_of_console: unknown, hosted_in: unknown}
    checked_on: "2026-11-12"
    confidence: M
    source_urls:
      - https://console.groq.com/docs/rate-limits
      - https://console.groq.com/docs/legal/services-agreement
      - https://console.groq.com/docs/api-reference
    notes: >-
      Public models page lists openai/gpt-oss-20b and openai/gpt-oss-120b as
      production models (131,072 context). That page's rate-limit column is the
      Developer plan (250K TPM, 1K RPM). Free-plan caps are lower and are shown
      at https://console.groq.com/settings/limits. The models API returned 401
      without a key. llama-3.3-70b-versatile is enterprise-only on that page.
    deployments:
      - id: groq-gpt-oss-20b
        model: groq/openai/gpt-oss-20b
        mode: chat
        # 2026-11-13: owner's observation, not provider documentation: gpt-oss reasons first;
        # empty answer at max_tokens 16-20, fine at 300 (2026-11-12). The first skills run on
        # real keys (2026-11-13, research-report) still had 21 of 62 answers empty at the light
        # ceiling of 300, which the old floor of 256 never raised: 1024 leaves room to answer.
        min_output_tokens: 1024
        # reasoning_effort low|medium|high is documented for GPT-OSS 20B/120B on
        # https://console.groq.com/docs/reasoning (read 2026-11-13); LiteLLM 1.108.5 passes it
        # through for groq/ (get_supported_openai_params). Less thinking on short tasks.
        reasoning: {param: reasoning_effort, light: low, everyday: low}
        aliases: [fast, cheap]
        order: 1
        rpm: 30
        context_tokens: 131072
        join: always
        verified: groq-models-page-and-litellm-1.108.5
        notes: About 1,000 tokens/sec on the Groq models page. 131k context, so it is not in long-context.
      - id: groq-gpt-oss-120b
        model: groq/openai/gpt-oss-120b
        mode: chat
        # 2026-11-13: owner's observation, not provider documentation: gpt-oss reasons first;
        # empty answer at max_tokens 16-20, fine at 300 (2026-11-12). The first skills run on
        # real keys (2026-11-13, research-report) still had 21 of 62 answers empty at the light
        # ceiling of 300, which the old floor of 256 never raised: 1024 leaves room to answer.
        min_output_tokens: 1024
        # reasoning_effort low|medium|high is documented for GPT-OSS 20B/120B on
        # https://console.groq.com/docs/reasoning (read 2026-11-13); LiteLLM 1.108.5 passes it
        # through for groq/ (get_supported_openai_params). Less thinking on short tasks.
        reasoning: {param: reasoning_effort, light: low, everyday: low}
        aliases: [smart]
        order: 1
        rpm: 20
        context_tokens: 131072
        join: always
        verified: groq-models-page-and-litellm-1.108.5
        notes: Larger GPT-OSS model. Same 131,072 context. Not in long-context.

  - id: cohere
    env: COHERE_API_KEY
    tier: trial
    # Cohere's rate-limit docs: trial keys get 1,000 API calls a month in total.
    quota:
      requests_per_month: 1000
    policy:
      trains_on_inputs: unknown
      human_review: unknown
      region: us
      commercial_use: prohibited
      terms_url: https://cohere.com/pricing
      note: "Trial keys are not permitted for production or commercial use (1,000 calls a month). One account only. The 2022 Terms of Use are written for business use and exclude personal or household purposes; read them before relying on a trial key."
    key_url: https://dashboard.cohere.com/api-keys
    name: Cohere
    one_off: false
    kind_of_allowance: [monthly]
    good_for: [everyday, quick_answers, long_documents, embeddings, reranking]
    allowance:
      - {window: month, limit: 1000, unit: requests, scope: "trial key, all endpoints together", headline: true}
      - {window: minute, limit: 20, unit: requests, scope: "chat, trial key"}
      - {window: minute, limit: 10, unit: requests, scope: "rerank, trial key"}
      - {window: minute, limit: 2000, unit: inputs, scope: "embed, trial key"}
    reset: {rule: unknown}
    read_remaining:
      method: unknown
      note: "The rate-limits page does not say how the monthly limit resets or how to read what is left."
    connection:
      method: paste_key
      key_url: https://dashboard.cohere.com/api-keys
      card_required: unknown
      phone_required: unknown
      minutes_estimate: 4
      usable_on_phone: unknown
      test: {url: https://api.cohere.com/v1/models, auth: bearer}
      steps:
        - id: open-page
          title: {en: "Open Cohere's key page", zh-TW: "打開 Cohere 的金鑰頁面"}
          detail: {en: "Muse opens dashboard.cohere.com/api-keys. Sign in, or sign up there if you do not have an account yet.", zh-TW: "Muse 會打開 dashboard.cohere.com/api-keys。請在那裡登入；還沒有帳號的話就先註冊。"}
        - id: find-key
          title: {en: "Find your trial key", zh-TW: "找到你的試用金鑰"}
          detail: {en: "Trial keys are free but limited. Find your trial key on that page.", zh-TW: "試用金鑰免費，但有次數限制。請在該頁面找到你的試用金鑰。"}
        - id: copy-key
          title: {en: "Copy the key", zh-TW: "複製金鑰"}
          detail: {en: "Copy it, then come back here and paste it when asked.", zh-TW: "複製後回到這裡，等 Muse 詢問時貼上。"}
    terms_flags: {one_account_per_person: unknown, aggregation_or_reselling: unknown, automation_of_console: unknown, hosted_in: unknown}
    checked_on: "2026-11-12"
    confidence: M
    source_urls:
      - https://docs.cohere.com/docs/rate-limits
      - https://docs.cohere.com/docs/how-does-cohere-pricing-work
      - https://docs.cohere.com/reference/list-models
    notes: >-
      Trial keys are free and, per Cohere's rate-limit docs, capped at 1,000
      calls per month. Chat is additionally about 20 requests per minute.
      Order 2 so Gemini and Groq absorb traffic first.
    deployments:
      - id: cohere-command-r7b
        model: cohere_chat/command-r7b-12-2024
        mode: chat
        aliases: [fast, cheap]
        order: 2
        rpm: 5
        context_tokens: 128000
        join: always
        verified: cohere-models-page-and-litellm-1.108.5
        notes: Small Command model, 128k context, 4k max output on the models page.
      - id: cohere-command-a
        model: cohere_chat/command-a-03-2025
        mode: chat
        aliases: [smart, long-context]
        order: 2
        rpm: 4
        context_tokens: 256000
        join: always
        verified: cohere-models-page-and-litellm-1.108.5
        notes: Command A, 256k context. command-a-plus-05-2026 is newer but the models page lists it at 128k, so it is not the long-context pick.
      - id: cohere-embed-v5-fast
        model: cohere/embed-v5.0-fast
        mode: embedding
        aliases: [embed]
        order: 2
        rpm: 5
        join: always
        verified: cohere-models-page-and-litellm-1.108.5
        notes: Default output dimension on the models page is 2048, with 256/512/768/1024/1536/2048 available. Do not mix these vectors with Gemini or Jina vectors.
      - id: cohere-rerank-v4-fast
        model: cohere/rerank-v4.0-fast
        mode: rerank
        aliases: [rerank]
        order: 1
        rpm: 5
        join: always
        verified: cohere-models-page-and-litellm-1.108.5
        notes: Live on the models page (32k). Cohere recommends rerank-v5.0-fast for new projects; that id is not in the LiteLLM 1.108.5 price map, so v4.0-fast is what the proxy is configured to call.

  - id: openrouter
    env: OPENROUTER_API_KEY
    tier: free
    policy:
      trains_on_inputs: yes
      human_review: unknown
      region: varies
      commercial_use: unknown
      terms_url: https://openrouter.ai/terms
      note: "Some free models store or train on inputs. Extra accounts or keys do not raise limits and are prohibited. No reselling or transferring access."
    key_url: https://openrouter.ai/keys
    name: OpenRouter
    one_off: false
    kind_of_allowance: [daily]
    good_for: [everyday, quick_answers, long_documents]
    allowance:
      - {window: minute, limit: 20, unit: requests, scope: free models}
      - {window: day, limit: 50, unit: requests, scope: free models, condition: "fewer than 10 credits bought, all time", headline: true}
      - {window: day, limit: 1000, unit: requests, scope: free models, condition: "10 or more credits bought, all time"}
    reset: {rule: utc_day}
    read_remaining:
      method: api_endpoint
      endpoint: https://openrouter.ai/api/v1/key
      fields: [data.free_model_daily_requests.limit, data.free_model_daily_requests.used, data.free_model_daily_requests.remaining]
      note: "Free-model requests for the current UTC day. muse/probes.py reads this."
    connection:
      method: oauth_pkce
      auth_url: https://openrouter.ai/auth
      exchange_url: https://openrouter.ai/api/v1/auth/keys
      key_url: https://openrouter.ai/keys
      card_required: unknown
      phone_required: unknown
      minutes_estimate: 1
      usable_on_phone: unknown
      test: {url: https://openrouter.ai/api/v1/key, auth: bearer}
      steps:
        - id: approve
          title: {en: "Approve on OpenRouter's own page", zh-TW: "在 OpenRouter 自己的頁面核准"}
