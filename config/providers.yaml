  - id: cerebras
    name: Cerebras
    env: CEREBRAS_API_KEY
    tier: free
    policy:
      trains_on_inputs: unknown
      human_review: unknown
      region: unknown
      commercial_use: unknown
      terms_url: https://www.cerebras.ai/terms-of-service
      note: "Training and review terms for the API were not confirmed, so the private class skips it. The website terms say Cerebras's right to monitor content does not give it the right to train on it; the pricing page footnote says the free offer is not intended for production use."
    key_url: https://cloud.cerebras.ai
    one_off: false
    kind_of_allowance: [daily]
    good_for: [everyday, quick_answers]
    allowance:
      - {window: day, limit: 1000000, unit: tokens, scope: "gpt-oss-120b, free trial, per model", headline: true}
      - {window: minute, limit: 5, unit: requests, scope: "gpt-oss-120b, free trial, per model"}
      - {window: day, limit: 1000000, unit: tokens, scope: "qwen-3.8-27b, free trial, per model"}
      - {window: minute, limit: 5, unit: requests, scope: "qwen-3.8-27b, free trial, per model"}
    reset: {rule: rolling}
    read_remaining:
      method: unknown
      note: "Quota replenishes continuously rather than at fixed times. The rate-limits page does not mention headers that report what is left."
    connection:
      method: paste_key
      key_url: https://cloud.cerebras.ai
      card_required: unknown
      phone_required: unknown
      minutes_estimate: 4
      usable_on_phone: unknown
      test: {url: https://api.cerebras.ai/v1/models, auth: bearer}
      steps:
        - id: sign-in
          title: {en: "Sign up or log in to Cerebras Cloud", zh-TW: "註冊或登入 Cerebras Cloud"}
          detail: {en: "Muse opens cloud.cerebras.ai. Sign up or log in there.", zh-TW: "Muse 會打開 cloud.cerebras.ai。請在那裡註冊或登入。"}
        - id: create-key
          title: {en: "Open API Keys and create a key", zh-TW: "打開 API Keys 並建立金鑰"}
          detail: {en: "Choose API Keys in the left menu and create a key. Muse does not click anything for you.", zh-TW: "在左側選單選 API Keys，然後建立一組金鑰。Muse 不會替你點擊任何東西。"}
        - id: copy-key
          title: {en: "Copy the key", zh-TW: "複製金鑰"}
          detail: {en: "Copy it, then come back here and paste it when asked.", zh-TW: "複製後回到這裡，等 Muse 詢問時貼上。"}
    terms_flags: {one_account_per_person: unknown, aggregation_or_reselling: unknown, automation_of_console: unknown, hosted_in: unknown}
    checked_on: "2026-11-12"
    confidence: M
    source_urls:
      - https://inference-docs.cerebras.ai/support/rate-limits
      - https://inference-docs.cerebras.ai/quickstart
      - https://www.cerebras.ai/terms-of-service
      - https://www.cerebras.ai/pricing
    notes: >-
      Cerebras Inference free trial. Limits are per model and were read from the
      rate-limits page on 2026-11-12 (gpt-oss-120b and qwen-3.8-27b: 5 requests a
      minute, 1M tokens a day). LiteLLM 1.108.5 routes cerebras/<model> to
      https://api.cerebras.ai/v1 and has both models in its price map. Context
      windows come from that map.
    deployments:
      - id: cerebras-gpt-oss-120b
        model: cerebras/gpt-oss-120b
        mode: chat
        # 2026-11-13: owner's observation, not provider documentation: gpt-oss reasons first;
        # empty answer at max_tokens 16-20, fine at 300 (2026-11-12). The first skills run on
        # real keys (2026-11-13, research-report) still had 21 of 62 answers empty at the light
        # ceiling of 300, which the old floor of 256 never raised: 1024 leaves room to answer.
        min_output_tokens: 1024
        # reasoning_effort low|medium (default)|high for gpt-oss-120b, reasoning tokens count toward
        # max_completion_tokens: https://inference-docs.cerebras.ai/capabilities/reasoning (read
        # 2026-11-13); LiteLLM 1.108.5 passes it through for cerebras/.
        reasoning: {param: reasoning_effort, light: low, everyday: low}
        aliases: [smart]
        order: 2
        rpm: 5
        context_tokens: 131072
        join: always
        verified: cerebras-rate-limits-page-and-litellm-1.108.5
        notes: Free-trial model on the rate-limits page. 131,072 context from the LiteLLM map, so not in long-context.
      - id: cerebras-qwen-3-8-27b
        model: cerebras/qwen-3.8-27b
        mode: chat
        aliases: [fast, cheap]
        order: 2
        rpm: 5
        context_tokens: 65536
        join: always
        verified: cerebras-rate-limits-page-and-litellm-1.108.5
        notes: Free-trial model on the rate-limits page and the quickstart. 65,536 context from the LiteLLM map.

  - id: cloudflare
    name: Cloudflare Workers AI
    env: CLOUDFLARE_API_KEY
    also_env: [CLOUDFLARE_ACCOUNT_ID]
    tier: free
    policy:
      trains_on_inputs: no
      human_review: unknown
      region: unknown
      commercial_use: unknown
      terms_url: https://developers.cloudflare.com/workers-ai/platform/data-usage/
      note: "Cloudflare says it does not use Customer Content processed by Workers AI to train models, and does not keep inputs or outputs of plain inference requests. Human review is not addressed, so the private class still skips it."
    key_url: https://dash.cloudflare.com/
    one_off: false
    kind_of_allowance: [daily]
    good_for: [everyday, quick_answers]
    allowance:
      - {window: day, limit: 10000, unit: neurons, scope: "all Workers AI models, free plan", headline: true}
    reset: {rule: utc_day}
    read_remaining:
      method: unknown
      note: "The pricing page says limits reset at 00:00 UTC and that requests fail once the free amount is used. It does not say how to read what is left."
    connection:
      method: paste_key
      key_url: https://dash.cloudflare.com/
      card_required: unknown
      phone_required: unknown
      minutes_estimate: 8
      usable_on_phone: unknown
      steps:
        - id: sign-in
          title: {en: "Sign up or log in to Cloudflare", zh-TW: "註冊或登入 Cloudflare"}
          detail: {en: "Muse opens dash.cloudflare.com. Sign up or log in there.", zh-TW: "Muse 會打開 dash.cloudflare.com。請在那裡註冊或登入。"}
        - id: account-id
          title: {en: "Copy your Account ID", zh-TW: "複製你的帳號 ID（Account ID）"}
          detail: {en: "Open the Workers AI page, choose Use REST API, and copy the Account ID. Come back here and paste it when asked.", zh-TW: "打開 Workers AI 頁面，選「Use REST API」，複製 Account ID。回到這裡，等 Muse 詢問時貼上。"}
        - id: create-token
          title: {en: "Create a Workers AI API token", zh-TW: "建立 Workers AI API 權杖"}
          detail: {en: "On the same page choose Create a Workers AI API Token, review the prefilled details and create it. Muse does not click anything for you.", zh-TW: "在同一頁選「Create a Workers AI API Token」，確認預填內容後建立。Muse 不會替你點擊任何東西。"}
        - id: copy-token
          title: {en: "Copy the token", zh-TW: "複製權杖"}
          detail: {en: "Copy the token, then come back here and paste it when asked.", zh-TW: "複製權杖，再回到這裡，等 Muse 詢問時貼上。"}
    terms_flags: {one_account_per_person: unknown, aggregation_or_reselling: unknown, automation_of_console: unknown, hosted_in: unknown}
    checked_on: "2026-11-12"
    confidence: M
    source_urls:
      - https://developers.cloudflare.com/workers-ai/platform/pricing/
      - https://developers.cloudflare.com/workers-ai/get-started/rest-api/
      - https://developers.cloudflare.com/workers-ai/configuration/open-ai-compatibility/
      - https://developers.cloudflare.com/workers-ai/platform/data-usage/
      - https://developers.cloudflare.com/workers-ai/models/
    notes: >-
      Workers AI free plan: 10,000 neurons a day, reset at 00:00 UTC (pricing
      page, 2026-11-12). LiteLLM 1.108.5 routes cloudflare/<@cf model> to
      https://api.cloudflare.com/client/v4/accounts/<account id>/ai/v1 and reads
      the account id from CLOUDFLARE_ACCOUNT_ID, so the provider needs both
      variables (also_env). Model ids are on the Workers AI models page.
      Context windows come from the LiteLLM price map, not from Cloudflare.
    deployments:
      - id: cloudflare-llama-3-1-8b
        model: cloudflare/@cf/meta/llama-3.1-8b-instruct-fp8
        mode: chat
        aliases: [fast, cheap]
        order: 3
        rpm: 10
        context_tokens: 32000
        join: always
        verified: cloudflare-models-page-and-litellm-1.108.5
        notes: Small Llama. The neurons one request costs depend on the model; this one is the cheapest of the two.
      - id: cloudflare-llama-3-3-70b
        model: cloudflare/@cf/meta/llama-3.3-70b-instruct-fp8-fast
        mode: chat
        aliases: [smart]
        order: 3
        rpm: 5
        context_tokens: 24000
        join: always
        verified: cloudflare-models-page-and-litellm-1.108.5
        notes: Larger Llama. Uses the free neurons faster than the 8B model. 24,000 context from the LiteLLM map.

