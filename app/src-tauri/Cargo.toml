[package]
name = "muse-app"
version = "0.1.0"
edition = "2021"
description = "The Muse desktop app shell (Tauri v2): the window, the menu-bar icon and its small panel, and the bridge to the home."
publish = false

[workspace]
members = [".", "crates/home-link"]

[lib]
name = "muse_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
# Exact versions; Cargo.lock (committed) pins everything beneath them.
tauri = { version = "=2.12.5", features = ["tray-icon"] }
# Opens an allowed link in the person's browser. Called from Rust only; the web view is
# given no opener permission (see capabilities/default.json).
tauri-plugin-opener = "=2.7.3"
serde_json = "=1.0.154"
muse-home-link = { path = "crates/home-link" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
