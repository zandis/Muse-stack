      x-scope: settings.write
      x-roles: [owner]
      summary: "Change settings."
      description: |
        Written to the home's settings file, the one `MUSE_*` settings are read from. A provider key is never written here. `restart.needed` is true when the router must start again to see the change (the daily limit, the default privacy).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SettingsChange"}
      responses:
        "200":
          description: "The settings after the change."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SettingsReply"}
        "400": {$ref: "#/components/responses/Invalid"}
        "503": {$ref: "#/components/responses/Unavailable"}
        default: {$ref: "#/components/responses/Error"}

  /v1/memory:
    get:
      operationId: getMemory
      x-scope: settings.read
      x-roles: [owner, viewer]
      summary: "What the helper remembers about the person. Not built: says so."
      description: |
        Helper memory does not exist yet. `built` is false and `items` is empty; `note` is `nothing_remembered`.
      responses:
        "200":
          description: "Nothing is remembered yet."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Memory"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      operationId: forgetEverything
      x-scope: settings.write
      x-roles: [owner]
      summary: "Forget everything the helper keeps about the person."
      description: |
        There is no helper memory yet, so this erases the kept conversations, which is all there is.
      responses:
        "200":
          description: "What was erased."
          content:
            application/json:
              schema:
                type: object
                properties:
                  built: {type: boolean}
                  items_removed: {type: integer}
                  conversations_removed: {type: integer}
                  recorded: {type: boolean}
        default: {$ref: "#/components/responses/Error"}

  /v1/verify:
    post:
      operationId: verifyInstallation
      x-scope: home.admin
      x-roles: [owner]
      summary: "Check that this installation is genuine."
      description: |
        Runs the checks of `scripts/verify_litellm.py` (the installed router against its pinned version and file record, and the known signs of the March 2026 malware). Read-only, no network. No request body.
      responses:
        "200":
          description: "The result and its lines."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Verify"}
        "503": {$ref: "#/components/responses/Unavailable"}
        default: {$ref: "#/components/responses/Error"}

  /v1/about:
    get:
      operationId: getAbout
      x-scope: settings.read
      x-roles: [owner, viewer]
      summary: "Versions, the catalogue's date, and which parts of the app are built."
      description: |
        `features.recovery` is false until the vault is wired into the home: the app then shows the recovery-key step as coming, never made-up words.
      responses:
        "200":
          description: "About this home."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/About"}
        default: {$ref: "#/components/responses/Error"}

components:
  securitySchemes:
    deviceToken:
      type: http
      scheme: bearer
      description: |
        A device token made on the home with `muse home token add <name> [--role owner|host|viewer]`;
        the home keeps only its SHA-256 and the role. `muse hosts setup` makes `host` tokens. In a later version this becomes a mandate token narrowed from the
        device's mandate; the header stays the same.

  parameters:
    provider:
      name: provider
      in: path
      required: true
      description: A service id from the catalogue, such as `gemini`.
      schema: {type: string, pattern: "^[a-z][a-z0-9_]{0,23}$"}
    jobId:
      name: id
      in: path
      required: true
      schema: {type: string, pattern: "^[0-9a-f]{12}$"}
    cardId:
      name: id
      in: path
      required: true
      schema: {type: string, pattern: "^[0-9a-f]{16}$"}
    appName:
      name: name
      in: path
      required: true
      schema: {$ref: "#/components/schemas/AppName"}
    skillName:
      name: name
      in: path
      required: true
      description: A skill's name, from `GET /v1/skills`.
      schema: {type: string, pattern: "^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$"}
    runId:
      name: id
      in: path
      required: true
      schema: {type: string, pattern: "^[0-9a-f]{16}$"}

    turnId:
      name: id
      in: path
      required: true
      description: The id of a question, from `POST /v1/ask`.
      schema: {type: string, pattern: "^[0-9a-f]{16}$"}
    conversationId:
      name: id
      in: path
      required: true
      schema: {type: string, pattern: "^[0-9a-f]{16}$"}
    choreId:
      name: id
      in: path
      required: true
      schema: {type: string, pattern: "^[0-9a-f]{8}$"}
    serviceId:
      name: id
      in: path
      required: true
      description: A service id from the catalogue, such as `gemini`.
      schema: {type: string, pattern: "^[a-z][a-z0-9_]{0,23}$"}
    flowId:
      name: state_id
      in: path
      required: true
      description: The `state_id` of a one-tap connection in progress.
      schema: {type: string, pattern: "^[0-9a-f]{16}$"}

  responses:
    Error:
      description: Any error. See the list of codes in the description at the top.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Invalid:
      description: "`invalid_request`: a field is missing, unknown, mistyped or out of range, or part of the request looks like a key."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: "`not_found`."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Conflict:
      description: "`conflict`: it already exists, or it already finished."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unavailable:
      description: "`unavailable`: the home could not read or write its own state. Comes with `retry_after` when waiting helps."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotBuilt:
      description: "`not_built`: planned, not built yet."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}

  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              enum: [invalid_request, unauthorized, forbidden, not_found, method_not_allowed, conflict,
                     card_already_answered, card_expired, length_required, payload_too_large,
                     too_many_requests, internal, not_built, unavailable]
            message: {type: string, description: One plain sentence. Never a secret, a prompt or internal error text.}
            retry_after: {type: integer, minimum: 0, description: Seconds. Also sent as the Retry-After header.}

    FolderName:
      type: string
      pattern: "^[a-z0-9](?:[a-z0-9-]{0,38}[a-z0-9])?$"
      description: A name on the person's list of folders skills may be given (`muse skills folders`).

    Skill:
      type: object
      required: [name, description, version, source, approved, state, needs, reads_folders, writes_files, tier_default, privacy_default, budget]
      properties:
        name: {type: string}
        description: {type: string}
        version: {type: string}
        source: {enum: [shipped, home], description: Ships with Muse, or is in the person's own skills folder.}
        approved: {type: boolean, description: It may run.}
        state: {enum: [ready, not-approved, changed]}
        needs: {type: array, items: {type: string}, description: What it asks for, one plain sentence each.}
        reads_folders: {type: boolean, description: It reads the folders named for a run.}
        writes_files: {type: boolean, description: It proposes new files (each needs the person's approval).}
        tier_default: {type: string}
        privacy_default: {type: string}
        budget:
          type: object
          required: [requests, tokens, seconds, paid_usd]
          properties:
            requests: {type: integer}
            tokens: {type: integer}
            seconds: {type: number}
            paid_usd: {type: number}

    NewSkillRun:
      type: object
      additionalProperties: false
      properties:
        inputs:
          type: object
          maxProperties: 32
          description: The skill's inputs. Names are letters, digits and `_`; values are text (at most 20,000 characters), numbers, true or false.
        folders: {type: array, maxItems: 8, items: {$ref: "#/components/schemas/FolderName"}, description: Folders the skill may read, by name.}
        out: {oneOf: [{$ref: "#/components/schemas/FolderName"}, {type: "null"}], description: "The folder new files may be proposed in, by name. Absent: Muse's own folder for that skill."}
        budget:
          type: object
          additionalProperties: false
          description: Less than the skill's own budget, never more.
          properties:
            requests: {type: integer, minimum: 0}
            tokens: {type: integer, minimum: 0}
            seconds: {type: number, minimum: 0}
            paid_usd: {type: number, minimum: 0, default: 0}
        privacy: {type: [string, "null"], enum: [public, standard, private, local, null], description: "Never weaker than the skill's own."}
        task: {type: [string, "null"], enum: [light, everyday, heavy, frontier, null], description: "Never stronger than the skill's own."}

    WriteOutcome:
      type: object
      required: [state, file, reason]
      properties:
        state: {enum: [written, refused, discarded], description: "`refused`: approved, but it could not be written (the reason says why)."}
        file: {type: string, description: The file's name.}
        reason: {type: [string, "null"]}

    SkillRun:
      type: object
      required: [id, skill, status, created_at, finished_at, started_by, result, writes]
      properties:
        id: {type: string, pattern: "^[0-9a-f]{16}$"}
        skill: {type: string}
        status: {enum: [running, done, partial, needs_choice, failed]}
        created_at: {$ref: "#/components/schemas/Time"}
        finished_at: {oneOf: [{$ref: "#/components/schemas/Time"}, {type: "null"}]}
        started_by: {type: string, description: The device that started it.}
        result:
          type: [object, "null"]
          description: Null while running. `output` is the skill's answer and may hold the person's content.
          properties:
            output: {}
            notes: {type: array, items: {type: string}}
            check:
              type: object
              properties:
                status: {enum: [passed, failed, not-run]}
                reasons: {type: array, items: {type: string}}
            used: {type: object, description: "Requests, tokens, cost and the services used. Counts only."}
            options: {type: array, items: {type: object}, description: "For `needs_choice`: exactly what the router offered."}
            refusal: {type: [object, "null"]}
            privacy: {type: string}
        writes:
          type: array
          description: The files the run proposed. Each is a card; nothing is written until its card is approved.
          items:
            type: object
            required: [card_id, file, size, state, reason]
            properties:
              card_id: {type: string, pattern: "^[0-9a-f]{16}$"}
              file: {type: string}
              size: {type: integer}
              state: {enum: [pending, applying, written, refused, discarded]}
              reason: {type: [string, "null"]}

    SkillRunReply:
      type: object
      required: [run]
      properties:
        run: {$ref: "#/components/schemas/SkillRun"}

    Recorded:
      type: boolean
      description: |
        True when the home wrote a record of this call. False when it could not (the action still
        happened) or when the call changed nothing. Present on calls that change something;
        calls that only read do not carry it.

    Record:
      type: object
      description: |
        One signed record, exactly as `docs/spec/interfaces/record-format.md` section 1 defines it.
        `summary` and `summary_salt` are present unless the record was redacted; `links` and
        `egress` only when the record has them.
      required: [v, device, seq, time, mandate, actor, action, resource, summary_hash, outcome, cost, prev, sig]
      additionalProperties: false
      properties:
        v: {const: 1}
        device: {type: string, pattern: "^[0-9a-f]{64}$", description: The home's signing key.}
        seq: {type: integer, minimum: 0}
        time: {type: integer, minimum: 0, description: Milliseconds since 1970-01-01T00:00:00Z.}
        mandate: {type: [string, "null"], description: "`device:<name>` for a record a helper device caused; null for the person's own."}
        actor: {enum: [person, helper, system]}
        action: {type: string, description: "A dotted name such as `card.answer`; the list is in record-format.md section 1.3."}
        resource: {type: [string, "null"], pattern: "^[0-9a-f]{64}$", description: A keyed reference; never a name or content.}
        summary_hash: {type: string, pattern: "^[0-9a-f]{64}$"}
        outcome: {enum: [ok, declined, failed, undone]}
        cost:
          type: [object, "null"]
          required: [currency, minor]
          additionalProperties: false
          properties:
            currency: {type: string, pattern: "^[A-Z0-9]{3,8}$"}
            minor: {type: integer, minimum: 0, description: "A count of the currency's smallest unit: NT$30 is 3000."}
        links:
          type: object
          additionalProperties: false
          properties:
            job: {type: string}
            card: {type: string}
            payment_ref: {type: string}
            undo_of: {type: string, pattern: "^[0-9a-f]{64}$"}
        egress:
          type: string
          pattern: "^(?:none|home|(?:service|host):[a-z0-9][a-z0-9._-]{0,63})$"
          description: |
            Where the content of the action went: `none`, `home`, `service:<id>` or `host:<name>`.
            Absent: the record does not say. "Left my devices" is `service:` or `host:`.
        prev: {type: string, pattern: "^[0-9a-f]{64}$"}
        sig: {type: string, pattern: "^[0-9a-f]{128}$"}
        summary: {type: string, maxLength: 200, description: Short plain text that is safe to show. Render it as text.}
        summary_salt: {type: string, pattern: "^[0-9a-f]{32}$"}

    NewRecord:
      type: object
      additionalProperties: false
      required: [action, summary]
      properties:
        action:
          type: string
          description: |
            A dotted lower-case name, two to four segments. From a `host` device it must start with
            `host.` (`host.files.write`, `host.message.send`), so a host's own report can never pass
            for something the home did. From an `owner` device it is a name of its own (`note.add`),
            not one of the home's families (`home`, `card`, `app`, `key`, `job`, `skill`, `mandate`,
            `records`) and not `host`.
        summary: {type: string, minLength: 1, maxLength: 200, description: "What was done, in words, on one line. No content, no names of people, nothing shaped like a key."}
        outcome: {enum: [ok, declined, failed, undone], default: ok}
        cost:
          type: [object, "null"]
          required: [currency, minor]
          additionalProperties: false
          properties:
            currency: {type: string, pattern: "^[A-Z0-9]{3,8}$"}
            minor: {type: integer, minimum: 0}
        links:
          type: object
          additionalProperties: false
          properties:
            job: {type: string}
            card: {type: string}
            payment_ref: {type: string}
            undo_of: {type: string, pattern: "^[0-9a-f]{64}$"}
        egress: {type: string, pattern: "^(?:none|home|(?:service|host):[a-z0-9][a-z0-9._-]{0,63})$", description: Where the content went. Leave it out when not known.}
        resource: {type: [string, "null"], maxLength: 1024, description: "The thing acted on, as a name such as `file:/Notes/a.md`. Only a keyed reference to it is stored."}

    Time:
      type: string
      pattern: '^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\dZ$'
      description: UTC, to the second.

    Status:
      type: object
      description: |
        The snapshot built by `muse/status.py` (the `Snapshot` type in `muse/types.py` is the
        full definition), unchanged, plus `api_version` and four fields for the app: `money` (the paid
        total and the daily limit in the person's currency), `activity` (what is running and what
        finished today, each with a short title), `local_runtime` and `restart_pending`.
        Fields may be added; none are removed in v1.
      required: [api_version, generated_at, proxy, default_privacy, providers, aliases, recent, totals, apps, paid, queue, paused,
                 suggestions, resources, subscriptions, money, activity, local_runtime, restart_pending]
      properties:
        api_version: {const: "1"}
        generated_at: {$ref: "#/components/schemas/Time"}
        home: {type: string}
        proxy:
          type: object
          properties:
            url: {type: string}
            reachable: {type: [boolean, "null"]}
        default_privacy: {type: string}
        providers: {type: array, items: {type: object}, description: "Each service: configured, state (ok, cooling, exhausted, no_key, disabled, unknown), usage, limits with remaining and reset_at, deployments."}
        aliases: {type: array, items: {type: object}}
        recent: {type: array, items: {type: object}, description: The last calls, newest first, at most 50. Counts and names only.}
        totals: {type: object}
        apps: {type: array, items: {type: object}, description: Each app with today's use and what was turned away.}
        paid: {type: object, description: "Today's paid total: cap_usd, spent_usd, held_usd, calls, resets_at."}
        queue: {type: object, description: "Job counts by status, waiting, next_due_at."}
        paused: {type: boolean, description: The one switch. True after POST /v1/pause.}
        suggestions: {type: array, items: {type: object}, description: Ranked next services to connect.}
        resources: {type: array, items: {type: object}}
        subscriptions: {type: array, items: {type: object}}
        money: {$ref: "#/components/schemas/Money"}
        activity: {$ref: "#/components/schemas/Activity"}
        local_runtime: {type: boolean, description: An AI on this computer is found and answering.}
        restart_pending: {type: boolean, description: "A key or setting changed through this API since the router was last restarted through it."}

    Bilingual:
      type: object
      description: The same text in each language Muse ships.
      properties:
        en: {type: string}
        zh-TW: {type: string}

    Catalogue:
      type: object
      required: [connected, providers, suggestions, resources, subscriptions]
      properties:
        connected: {type: array, items: {type: string}, description: Ids of the services whose key is on the home.}
        providers:
          type: array
          items:
            type: object
            required: [id, name, kind, tier, local, connected, key_env, also_env, connection]
            properties:
              id: {type: string}
              name: {type: string}
              kind: {type: string}
              tier: {type: string}
              local: {type: boolean}
              connected: {type: boolean}
              one_off: {type: boolean}
              key_env: {type: [string, "null"], description: The name the key is stored under. A name, never a value.}
              also_env: {type: array, items: {type: string}}
              kind_of_allowance: {type: array, items: {type: string}}
              good_for: {type: array, items: {type: string}}
              gain:
                type: [object, "null"]
                properties:
                  window: {type: string}
                  limit: {type: integer}
                  unit: {type: string}
              gain_text: {$ref: "#/components/schemas/Bilingual"}
              connection:
                type: [object, "null"]
                properties:
                  method: {type: string, description: "paste_key, oauth_pkce, local or none."}
                  key_url: {type: [string, "null"]}
                  minutes_estimate: {type: [integer, "null"]}
                  card_required: {type: string}
                  phone_required: {type: string}
                  usable_on_phone: {type: string}
                  steps: {type: integer}
              checked_on: {type: [string, "null"]}
              confidence: {type: [string, "null"]}
              source_urls: {type: array, items: {type: string}}
        suggestions: {type: array, items: {type: object}, description: The same entries as `suggestions` in the status snapshot.}
        resources: {type: array, items: {type: object}}
        subscriptions: {type: array, items: {type: object}}

    ConnectionStart:
      type: object
      required: [provider, name, connected, method, finish_with, open_url, steps, key, also, next]
      properties:
        provider: {type: string}
        name: {type: string}
        connected: {type: boolean}
        method: {type: string, description: The catalogue's method for this service.}
        finish_with: {const: paste_key}
        open_url: {type: [string, "null"], description: The service's own page, for the client to open.}
        minutes_estimate: {type: [integer, "null"]}
        card_required: {type: string}
        phone_required: {type: string}
        steps:
          type: array
          items:
            type: object
            required: [id, title, detail]
            properties:
              id: {type: string}
              title: {$ref: "#/components/schemas/Bilingual"}
              detail: {$ref: "#/components/schemas/Bilingual"}
        key:
          type: object
          required: [name, starts_with]
          properties:
            name: {type: string}
            starts_with: {type: [string, "null"], description: What this service's keys are known to start with, for a gentle check before sending.}
        also:
          type: array
          items:
            type: object
            required: [name, configured]
            properties:
              name: {type: string}
              configured: {type: boolean}
        next:
          type: object
          required: [method, path]
          properties:
            method: {const: POST}
            path: {type: string}

    KeyStored:
      type: object
      required: [provider, stored, backend, warnings, still_needed, restart, recorded]
      properties:
        provider: {type: string}
        recorded: {$ref: "#/components/schemas/Recorded"}
        stored: {type: array, items: {type: string}, description: The names that were stored. Never values.}
        backend: {type: [string, "null"], description: "keychain or dotenv (fake on a fake home)."}
        warnings: {type: array, items: {type: string}}
        still_needed: {type: array, items: {type: string}, description: Extra settings this service needs that are not on the home yet.}
        restart:
          type: object
          required: [needed, proxy_running, command]
          properties:
            needed: {type: boolean}
            proxy_running: {type: boolean}
            command: {type: string, description: What makes the router read the new key.}

    NewCard:
      type: object
      additionalProperties: false
      required: [kind, title, thing]
      properties:
        kind: {enum: [save_file, message, spend, grant_permission, oneoff_credit, send_private, install_skill]}
        title: {type: string, minLength: 1, maxLength: 80}
        thing: {type: string, minLength: 1, maxLength: 200, description: What exactly, such as the file name or the payee and amount.}
        where: {type: string, maxLength: 200, description: Where it goes or happens.}
        under: {type: string, maxLength: 200, description: "Who is asking and under what, in words."}
        cost:
          type: [object, "null"]
          description: '`{"nothing": true}` (the default) or `{"amount": "30", "currency": "TWD"}`. A spend card needs an amount.'
        extra:
          type: [object, "null"]
          description: The fields of this kind of card, exactly as in card.schema.json.
        ttl_s:
          type: number
          exclusiveMinimum: 0
          maximum: 2592000
          description: Seconds until the card expires. Default 24 hours; 5 minutes for a spend card.
    NewJob:
      type: object
      additionalProperties: false
      properties:
        kind: {enum: [prompt, batch], default: prompt}
        prompt: {type: string, minLength: 1, maxLength: 100000, writeOnly: true, description: For kind prompt.}
        prompts:
          type: array
          minItems: 1
          maxItems: 20
          writeOnly: true
          items: {type: string, minLength: 1}
          description: For kind batch. 100,000 characters in all at most.
        task: {type: [string, "null"], description: "A routing task such as light or everyday."}
        alias: {type: [string, "null"], description: A model alias such as cheap. Ignored when task is given.}
        privacy: {enum: [public, standard, private, local, null]}
        allow_paid: {type: boolean, default: false}
        max_tokens: {type: integer, minimum: 1, default: 1024}
        max_attempts: {type: integer, minimum: 1, default: 5}
        deadline: {type: [string, "null"], description: "A time with a zone, such as 2026-11-14T08:30:00Z. The job fails if it has not finished by then."}

    Job:
      type: object
      description: Metadata only. There is no prompt and no result here, by design.
      required: [id, created_at, kind, alias, status, attempts, out_path, allow_paid]
      properties:
        id: {type: string, pattern: "^[0-9a-f]{12}$"}
        created_at: {$ref: "#/components/schemas/Time"}
        kind: {enum: [prompt, file-summary, batch]}
        alias: {type: string}
        task: {type: [string, "null"]}
        privacy: {type: [string, "null"]}
        out_path: {type: string, description: The file on the home that receives the result.}
        status: {enum: [queued, running, deferred, done, failed, cancelled]}
        attempts: {type: integer}
        deferrals: {type: integer}
        next_attempt_at: {type: [string, "null"]}
        last_reason: {type: [string, "null"], description: A code, never content.}
        started_at: {type: [string, "null"]}
        finished_at: {type: [string, "null"]}
        provider: {type: [string, "null"]}
        deployment: {type: [string, "null"]}
        cost_usd: {type: [number, "null"]}
        tokens_in: {type: [integer, "null"]}
        tokens_out: {type: [integer, "null"]}
        max_attempts: {type: integer}
        max_tokens: {type: integer}
        deadline: {type: [string, "null"]}
        allow_paid: {type: boolean}
        progress: {type: integer, description: "Batch: prompts finished."}

    JobReply:
      type: object
      required: [job]
      properties:
        job: {$ref: "#/components/schemas/Job"}
        recorded: {$ref: "#/components/schemas/Recorded"}

    Card:
      $ref: "card.schema.json"

    CardReply:
      type: object
      required: [card]
      properties:
        card: {$ref: "#/components/schemas/Card"}
        recorded: {$ref: "#/components/schemas/Recorded"}

    AppName:
      type: string
      pattern: "^[a-z0-9](?:[a-z0-9-]{0,38}[a-z0-9])?$"

    AppSettings:
      type: object
      properties:
        priority: {enum: [interactive, normal, background]}
        daily_requests: {type: [integer, "null"], minimum: 0}
        daily_tokens: {type: [integer, "null"], minimum: 0}
        allow_paid: {type: [boolean, "null"]}
        default_privacy: {enum: [public, standard, private, local, null]}
        note: {type: [string, "null"], maxLength: 200}

    App:
      type: object
      required: [name, priority, daily_requests, daily_tokens, allow_paid, default_privacy, note, created_at]
      properties:
        name: {$ref: "#/components/schemas/AppName"}
        priority: {enum: [interactive, normal, background]}
        daily_requests: {type: [integer, "null"]}
        daily_tokens: {type: [integer, "null"]}
        allow_paid: {type: boolean}
        default_privacy: {type: [string, "null"]}
        note: {type: [string, "null"]}
        created_at: {type: [string, "null"]}

    AppWithToken:
      type: object
      required: [app, token, token_shown_once, recorded]
      properties:
        app: {$ref: "#/components/schemas/App"}
        recorded: {$ref: "#/components/schemas/Recorded"}
        token: {type: string, readOnly: true, description: The app's router token. Shown this once; store it on the device that needs it.}
        token_shown_once: {const: true}

    # ---- the app's routes (muse/home/app_api.py)

    Amount:
      type: object
      description: |
        Money in US dollars and in the person's currency, as decimal strings. `approx` is true
        when the local figure was rounded from a conversion.
      required: [usd, local, approx]
      properties:
        usd: {type: string, pattern: '^\d+\.\d{2,4}$'}
        local: {type: string, pattern: '^\d+(\.\d{2})?$'}
        approx: {type: boolean}

    Money:
      type: object
      description: |
        The paid total in the person's currency. The rate is a setting, not a lookup:
        `rate_source` is always `fixed setting`. `daily_limit.source` is `default` until a limit
        is saved; the default is NT$30 (US$0.9375 at 32). `daily_limit.router_usd` is the cap the
        router enforces for the same settings, and `in_step` says whether the two agree: they
        differ on a home that has never stored a key or saved a limit, where the router's own
        default of US$1.00 still applies to other programs.
      required: [currency, rate, rate_source, rate_date, spent_today, daily_limit]
      properties:
        currency: {type: string, enum: [TWD, USD, JPY, KRW]}
        rate: {type: string, description: Units of the currency per US dollar.}
        rate_source: {const: fixed setting}
        rate_date: {type: string, format: date}
        spent_today: {$ref: "#/components/schemas/Amount"}
        daily_limit:
          allOf:
            - {$ref: "#/components/schemas/Amount"}
            - type: object
              required: [source, router_usd, in_step]
              properties:
                source: {type: string, enum: [default, setting]}
                router_usd: {type: string}
                in_step: {type: boolean}

    Title:
      type: object
      description: |
        A short human title. `key` names a sentence the app has in every language
        (`question_for_later`, `questions_for_later`, `file_summary`, `chore`); `text` is set only for
        a chore, and is the sentence the person wrote for it. Never the words of a plain question.
      required: [key, params, text]
      properties:
        key: {type: string}
        params: {type: object}
        text: {type: [string, "null"]}

    Activity:
      type: object
      required: [running, done_today]
      properties:
        running:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              kind: {type: string, enum: [job, chore]}
              title: {$ref: "#/components/schemas/Title"}
              status: {type: string}
              at: {type: [string, "null"]}
        done_today:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              kind: {type: string, enum: [job, chore]}
              title: {$ref: "#/components/schemas/Title"}
              status: {type: string}
              at: {type: [string, "null"]}
              ok: {type: boolean}

    AskRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: {type: string, minLength: 1, maxLength: 20000}
        conversation_id: {type: [string, "null"], pattern: "^[0-9a-f]{16}$"}
        privacy: {type: [string, "null"], enum: [public, standard, private, local, null], description: Default from Settings.}
        task: {type: [string, "null"], enum: [light, everyday, heavy, frontier, null], default: everyday}
        attachments:
          type: array
          maxItems: 8
          items: {$ref: "#/components/schemas/FolderName"}
          description: Folder names from the person's approved list. With any, the `files-answer` skill answers from those folders.

    HandoffApp:
      type: object
      description: One of the person's own apps. Links only; the client opens them. `url_app` is present when the app documents a link that opens it.
      required: [id, name, url_web]
      properties:
        id: {type: string}
        name: {type: string}
        url_web: {type: [string, "null"]}
        url_app: {type: string}

    AskAnswer:
      type: object
      description: A question and what became of it.
      required: [id, conversation_id, created_at, question, status]
      properties:
        id: {type: string, pattern: "^[0-9a-f]{16}$"}
        conversation_id: {type: string}
        created_at: {$ref: "#/components/schemas/Time"}
        question: {type: string}
        privacy: {type: [string, "null"]}
        task: {type: [string, "null"]}
        attachments: {type: array, items: {type: string}}
        status: {type: string, enum: [answered, choices, pending, queued, handed_off, over_limit, failed]}
        cut_short: {type: boolean, description: "The answer stopped at its length limit, or came back empty because the room went on reasoning."}
        can_continue: {type: boolean, description: "POST /v1/ask/{id}/continue may ask again with more room."}
        text: {type: string, description: The answer. Plain text; render it as text.}
        route:
          type: object
          description: |
            Which service answered and what it cost. `line` is the grey line as data, for the client to
            format: `key` is one of `free`, `free_refill`, `paid`, `local`, `cache`, `free_many`,
            `skill_local`, `unknown`; `params` may hold `service`, `refill_at`, `cost`, `count`.
          properties:
            provider: {type: [string, "null"]}
            name: {type: [string, "null"]}
            local: {type: boolean}
            cost: {$ref: "#/components/schemas/Amount"}
            cache: {type: boolean}
            refill_hint: {type: [string, "null"], description: When that service's daily allowance next refills, if known.}
            line:
              type: object
              required: [key, params]
              properties:
                key: {type: string}
                params: {type: object}
        details:
          type: object
          description: "Behind Details: the deployment, the task tier, tokens, and the flags `min_output` and `empty_reasoning`."
        sources:
          type: array
          description: "When the files skill answered: the passages it cites, as file › paragraph with the quoted words."
          items:
            type: object
            properties:
              n: {type: integer}
              file: {type: string, description: "The file as the skill showed it: relative to the allowed folder."}
              paragraphs: {type: array, items: {type: integer}, description: "The paragraph numbers the statements rest on."}
              quote: {type: string, description: "The words of the first of those paragraphs, at most 400 characters."}
              label: {type: string, description: "The skill's own `file › paragraph n` line, in the question's language."}
        handoff:
          type: object
          properties:
            apps: {type: array, items: {$ref: "#/components/schemas/HandoffApp"}}
        reason:
          type: string
          description: "Why there is no answer: used_up, busy, yielding, paid_needed, paid_limit, app_limit, private_no_service, paused, router_unreachable, refused_key, router_limit, empty, skill_failed, skill_busy, failed."
        choices:
          type: object
          description: Exactly the options the router named, in this order. A missing one was not offered.
          properties:
            wait:
              type: object
              properties:
                until: {$ref: "#/components/schemas/Time"}
            handoff:
              type: object
              properties:
                apps: {type: array, items: {$ref: "#/components/schemas/HandoffApp"}}
            pay: {$ref: "#/components/schemas/Amount"}
        over_limit:
          type: object
          description: Paying would pass today's limit. Nothing was spent.
          properties:
            over: {$ref: "#/components/schemas/Amount"}
            limit: {$ref: "#/components/schemas/Amount"}
            spent: {$ref: "#/components/schemas/Amount"}
            pay: {$ref: "#/components/schemas/Amount"}
            raise_today:
              type: object
              properties:
                to: {$ref: "#/components/schemas/Amount"}
        job_id: {type: string, description: "After `wait`: the queued job."}
        run_id: {type: string, description: The files skill's run.}
        until: {type: string}
        app:
          type: object
          description: "After `handoff`: the app it was opened in."

    AskReply:
      type: object
      required: [conversation_id, answer]
      properties:
        conversation_id: {type: string}
        answer: {$ref: "#/components/schemas/AskAnswer"}
        recorded: {type: boolean}
        streaming: {const: false}

    AskChoice:
      type: object
      additionalProperties: false
      required: [choice]
      properties:
        choice: {type: string, enum: [wait, handoff, pay]}
        app: {type: [string, "null"], description: "With `handoff`: the id of the app that was opened."}
        raise_today: {type: boolean, description: "With `pay`, after an `over_limit` answer: raise the limit for today only and pay."}

    ConversationList:
      type: object
      required: [conversations]
      properties:
        conversations:
          type: array
          items:
            type: object
            required: [id, created_at, updated_at, turns, preview]
            properties:
              id: {type: string}
              created_at: {$ref: "#/components/schemas/Time"}
              updated_at: {$ref: "#/components/schemas/Time"}
              turns: {type: integer}
              preview: {type: string, description: The first words of the first question.}
        kept: {type: string}
        limits: {type: object}

    Conversation:
      type: object
      required: [id, turns]
      properties:
        id: {type: string}
        turns: {type: array, items: {$ref: "#/components/schemas/AskAnswer"}}

    Chore:
      type: object
      description: A chore as `muse chores list --json` gives it, plus `lines`, `title`, `typical_time` and `paid`.
      required: [id, sentence, enabled, spare_only, when, budget_text, lines, title]
      properties:
        id: {type: string, pattern: "^[0-9a-f]{8}$"}
        sentence: {type: string}
        enabled: {type: boolean}
        spare_only: {type: boolean, description: Runs when there is allowance to spare.}
        typical_time: {type: [string, "null"], description: "For a spare-allowance chore: when it usually runs, HH:MM."}
        next_run: {type: [string, "null"]}
        when: {type: string}
        budget: {type: object}
        budget_text: {type: string}
        paid: {type: boolean}
        last_run_at: {type: [string, "null"]}
        last_status: {type: [string, "null"]}
        last_summary: {type: [string, "null"]}
        lines: {type: object, description: "what, when, where, budget, permission: the lines it was confirmed with, in the sentence's language."}
        title: {$ref: "#/components/schemas/Title"}

    ChoreList:
      type: object
      required: [chores, can_run, paused]
      properties:
        chores: {type: array, items: {$ref: "#/components/schemas/Chore"}}
        can_run: {type: boolean, description: This home can run chores.}
        paused: {type: boolean}

    ChoreReply:
      type: object
      required: [chore]
      properties:
        chore: {$ref: "#/components/schemas/Chore"}
        recorded: {type: boolean}

    ChoreSentence:
      type: object
      additionalProperties: false
      required: [sentence]
      properties:
        sentence: {type: string, minLength: 1, maxLength: 500}
        folders: {type: array, maxItems: 8, items: {$ref: "#/components/schemas/FolderName"}}
        out: {type: [string, "null"]}

    Understood:
      type: object
      description: What was understood from a sentence (`muse/skills/schedule.py::understand`).
      required: [ok, sentence, lang, questions]
      properties:
        ok: {type: boolean, description: Nothing is left to ask.}
        sentence: {type: string}
        lang: {type: string}
        spec: {type: [object, "null"]}
        what: {type: string}
        when: {type: string}
        where: {type: string}
        budget: {type: string}
        permission: {type: string}
        budget_values: {type: [object, "null"]}
        questions:
          type: array
          items:
            type: object
            properties:
              code: {type: string}
              text: {type: string}
        notes: {type: array, items: {type: string}}

    UnderstoodReply:
      type: object
      required: [understood, saved]
      properties:
        understood: {$ref: "#/components/schemas/Understood"}
        saved: {const: false}

    NewChore:
      type: object
      additionalProperties: false
      required: [understood]
      properties:
        understood: {$ref: "#/components/schemas/Understood"}
        privacy: {type: [string, "null"]}

    ChoreChange:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        enabled: {type: boolean}
        understood: {$ref: "#/components/schemas/Understood"}

    ChoreRun:
      type: object
      properties:
        id: {type: string}
        chore_id: {type: string}
        status: {type: string, enum: [queued, running, waiting_card, done, partial, failed, needs_choice, skipped, declined, expired]}
        trigger: {type: string}
        started_at: {type: [string, "null"]}
        finished_at: {type: [string, "null"]}
        summary: {type: [string, "null"], description: Counts and status words; never file contents.}
        card_id: {type: [string, "null"]}
        requests: {type: [integer, "null"]}
        cost_usd: {type: [number, "null"]}

    ChoreRunReply:
      type: object
      required: [run]
      properties:
        run: {$ref: "#/components/schemas/ChoreRun"}
        title: {$ref: "#/components/schemas/Title"}

    ChoreHistory:
      type: object
      required: [chore_id, runs]
      properties:
        chore_id: {type: string}
        runs: {type: array, items: {$ref: "#/components/schemas/ChoreRun"}}

    Services:
      type: object
      required: [connected, add, resources, subscriptions, local_runtime]
      properties:
        connected:
          type: array
          items:
            type: object
            required: [id, name, badge, state]
            properties:
              id: {type: string}
              name: {type: string}
              badge: {type: string, enum: [local, private, standard]}
              local: {type: boolean}
              left:
                type: [object, "null"]
                description: The tightest daily limit. `estimated` is false only for a figure the service itself reported.
              unlimited: {type: boolean}
              refill_at: {type: [string, "null"]}
              estimated: {type: boolean}
              good_for: {type: array, items: {type: string}}
              checked_on: {type: [string, "null"]}
              state: {type: string, enum: [ok, busy, used_up, key_refused, "off", unknown]}
              retry_at: {type: [string, "null"]}
              can_test: {type: boolean}
              can_disconnect: {type: boolean}
        add:
          type: array
          description: Ranked by allowance gained per minute.
          items:
            type: object
            properties:
              id: {type: string}
              name: {type: string}
              method: {type: string, enum: [one_tap, guided]}
              minutes: {type: [integer, "null"]}
              steps: {type: integer}
              card: {type: string, enum: ["yes", "no", unknown]}
              phone: {type: string, enum: ["yes", "no", unknown]}
              gain: {type: [object, "null"]}
              key_host: {type: [string, "null"], description: The https host of the service's own key page.}
              facts: {type: object, description: "`free_per_day` and `may_train`, for the two plain facts shown before connecting."}
        resources: {type: array, items: {type: object}, description: "Storage, computing and chain allowances: shown, not managed."}
        subscriptions: {type: array, items: {type: object}, description: The person's own ChatGPT, Claude and Gemini apps. Links only.}
        local_runtime: {type: boolean}
        restart_pending: {type: boolean}

    Restart:
      type: object
      description: Whether the router must start again to see a change, and whether this home can do that itself (`POST /v1/home/restart-proxy`).
      properties:
        needed: {type: boolean}
        proxy_running: {type: boolean}
        command: {type: string}
        managed: {type: boolean}

    ServiceTest:
      type: object
      required: [provider, result]
      properties:
        provider: {type: string}
        name: {type: string}
        result: {type: string, enum: [ok, refused, limited, failed, no_test, no_key]}
        status: {type: [integer, "null"]}
        sent_a_prompt: {const: false}

    ServiceRemoved:
      type: object
      required: [provider, removed]
      properties:
        provider: {type: string}
        removed: {type: boolean}
        still_set_elsewhere: {type: boolean, description: The key is also in this process's environment, which the home cannot change.}
        restart: {$ref: "#/components/schemas/Restart"}
        recorded: {type: boolean}

    OneTapStart:
      type: object
      additionalProperties: false
      properties:
        same_device: {type: boolean, default: false, description: The browser that will open `url` is on the home's own computer.}

    OneTapCode:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: {type: string, maxLength: 512}

    Flow:
      type: object
      required: [state_id, provider, mode, status]
      properties:
        state_id: {type: string, pattern: "^[0-9a-f]{16}$"}
        provider: {type: string}
        mode: {type: string, enum: [loopback, paste_code]}
        status: {type: string, enum: [pending, connected, failed]}
        reason: {type: [string, "null"], enum: [timeout, denied, bad_callback, exchange_failed, store_failed, cancelled, bad_code, null]}
        expires_at: {$ref: "#/components/schemas/Time"}
        url: {type: string, description: "On start only: the service's own page to open."}
        name: {type: string}
        facts: {type: object}
        gained: {type: object, description: "When connected: the service's name and what it adds, in each language."}
        restart: {$ref: "#/components/schemas/Restart"}

    AppPresets:
      type: object
      required: [endpoint, presets]
      properties:
        endpoint: {type: string, description: "The address to paste, such as http://127.0.0.1:4000/v1."}
        presets:
          type: array
          items:
            type: object
            properties:
              kind: {type: string}
              title: {type: string}
              priority: {type: string, enum: [interactive, normal, background]}
              daily_requests: {type: [integer, "null"]}
              daily_tokens: {type: [integer, "null"]}
              alias: {type: string}
              why: {type: string}
              steps: {type: array, items: {type: string}}
              key_placeholder: {const: "{key}"}
              verified: {type: boolean}
              verified_on: {type: [string, "null"]}
              checked_on: {type: string}
              source: {type: string}
              caveat: {type: [string, "null"]}

    Settings:
      type: object
      properties:
        daily_limit: {$ref: "#/components/schemas/Amount"}
        default_privacy: {type: string, enum: [standard, private, local]}
        language: {type: string, enum: [en, zh-TW]}
        language_set: {type: boolean}
        currency: {type: string}
        rate: {type: string}
        rate_source: {const: fixed setting}
        rate_date: {type: string}
        currencies: {type: array, items: {type: string}}
        languages: {type: array, items: {type: string}}
        privacy_choices: {type: array, items: {type: string}}
        restart_pending: {type: boolean}

    SettingsReply:
      type: object
      required: [settings]
      properties:
        settings: {$ref: "#/components/schemas/Settings"}
        changed: {type: array, items: {type: string}}
        restart: {$ref: "#/components/schemas/Restart"}
        recorded: {type: boolean}

    SettingsChange:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        daily_limit_local: {type: [number, string], description: The daily spending limit in the person's currency. Zero means never spend.}
        default_privacy: {type: string, enum: [standard, private, local]}
        language: {type: string, enum: [en, zh-TW]}
        currency: {type: string, enum: [TWD, USD, JPY, KRW]}
        usd_rate: {type: [number, string], description: Units of the currency per US dollar.}

    Memory:
      type: object
      required: [built, items, note]
      properties:
        built: {const: false}
        items: {type: array, maxItems: 0}
        note: {const: nothing_remembered}
        conversations: {type: integer, description: How many conversations are kept on the home.}

    Verify:
      type: object
      required: [result, lines]
      properties:
        result: {type: string, enum: [ok, problem, unknown]}
        lines:
          type: array
          items:
            type: object
            properties:
              level: {type: string}
              text: {type: string}

    About:
      type: object
      required: [versions, catalogue, features]
      properties:
        versions: {type: object, description: "muse, api, python, router."}
        catalogue:
          type: object
          properties:
            checked_on: {type: [string, "null"]}
            services: {type: integer}
        features:
          type: object
          description: What is built. All false today.
          properties:
            recovery: {type: boolean}
            memory: {type: boolean}
            streaming: {type: boolean}
            wallet: {type: boolean}
            export: {type: boolean}
        endpoint: {type: string}
        local_runtime: {type: boolean}
