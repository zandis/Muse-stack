            application/json:
              schema: {$ref: "#/components/schemas/ChoreList"}
        default: {$ref: "#/components/responses/Error"}
    post:
      operationId: addChore
      x-scope: chores.write
      x-roles: [owner]
      summary: "Save a chore from an understood object."
      description: |
        Send back the `understood` object of `POST /v1/chores/understand` (with `ok: true`). It is checked again on the home; a chore made this way never spends money.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NewChore"}
      responses:
        "201":
          description: "The new chore."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChoreReply"}
        "400": {$ref: "#/components/responses/Invalid"}
        default: {$ref: "#/components/responses/Error"}

  /v1/chores/understand:
    post:
      operationId: understandChore
      x-scope: chores.write
      x-roles: [owner]
      summary: "What the home understands from a sentence. Nothing is saved."
      description: |
        Rules only: no model is asked. `ok` is true when nothing is left to ask; otherwise `questions` says what is missing. `folders` and `out` are names from the person's approved folder list.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChoreSentence"}
      responses:
        "200":
          description: "What was understood."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UnderstoodReply"}
        "400": {$ref: "#/components/responses/Invalid"}
        default: {$ref: "#/components/responses/Error"}

  /v1/chores/{id}:
    patch:
      operationId: updateChore
      x-scope: chores.write
      x-roles: [owner]
      summary: "Pause, resume, or change a chore by sentence."
      description: |
        `enabled: false` pauses and `true` resumes. `understood` (from `POST /v1/chores/understand`) replaces the sentence and keeps the history.
      parameters:
        - {$ref: "#/components/parameters/choreId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChoreChange"}
      responses:
        "200":
          description: "The chore after the change."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChoreReply"}
        "400": {$ref: "#/components/responses/Invalid"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      operationId: deleteChore
      x-scope: chores.write
      x-roles: [owner]
      summary: "Delete a chore and its history. Files it already wrote are untouched."
      parameters:
        - {$ref: "#/components/parameters/choreId"}
      responses:
        "200":
          description: "Deleted."
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: {type: boolean}
                  recorded: {type: boolean}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /v1/chores/{id}/run:
    post:
      operationId: runChore
      x-scope: chores.write
      x-roles: [owner]
      summary: "Run a chore now."
      description: |
        Answers at once. The history says how it went; a result waits as a "Save a file" card. Refused with `conflict` while everything is paused. No request body.
      parameters:
        - {$ref: "#/components/parameters/choreId"}
      responses:
        "202":
          description: "Started."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChoreRunReply"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Error"}

  /v1/chores/{id}/history:
    get:
      operationId: getChoreHistory
      x-scope: chores.read
      x-roles: [owner, viewer]
      summary: "The runs of a chore, newest first, at most 50."
      parameters:
        - {$ref: "#/components/parameters/choreId"}
      responses:
        "200":
          description: "The runs."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ChoreHistory"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /v1/services:
    get:
      operationId: listServices
      x-scope: catalogue.read
      x-roles: [owner, host, viewer]
      summary: "What is connected and how much is left, what to add, other allowances and subscriptions."
      description: |
        One entry per connected service: what is left today (`estimated` when it is not a figure the service reported), when it refills, what it is good for, its privacy badge, when the catalogue was last checked. `add` is the ranked list with minutes and whether a card or phone number is needed (`unknown` when not confirmed).
      responses:
        "200":
          description: "The Services screen as data."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Services"}
        "503": {$ref: "#/components/responses/Unavailable"}
        default: {$ref: "#/components/responses/Error"}

  /v1/services/{id}/test:
