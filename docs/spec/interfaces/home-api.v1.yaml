      operationId: testService
      x-scope: keys.write
      x-roles: [owner]
      summary: "One small request that checks the stored key. No prompt is sent."
      description: |
        The catalogue's own key check (`muse connect --test`). `result` is `ok`, `refused`, `limited`, `failed`, `no_test` or `no_key`. No request body.
      parameters:
        - {$ref: "#/components/parameters/serviceId"}
      responses:
        "200":
          description: "How the check went."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ServiceTest"}
        "400": {$ref: "#/components/responses/Invalid"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Error"}

  /v1/services/{id}:
    delete:
      operationId: disconnectService
      x-scope: keys.write
      x-roles: [owner]
      summary: "Disconnect: remove the service's key from this home."
      description: |
        The router keeps using the key it started with until it is restarted; `restart` says so.
      parameters:
        - {$ref: "#/components/parameters/serviceId"}
      responses:
        "200":
          description: "Removed."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ServiceRemoved"}
        "400": {$ref: "#/components/responses/Invalid"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/Unavailable"}
        default: {$ref: "#/components/responses/Error"}

  /v1/connect/{provider}/start:
    post:
      operationId: startOneTap
      x-scope: connect.write
      x-roles: [owner]
      summary: "Start the one-tap connection (OAuth PKCE) and get the address to open."
      description: |
        For services whose catalogue method is `oauth_pkce` (OpenRouter). The home makes the PKCE pair and
        keeps the verifier; the client opens `url` in the person's browser and polls
        `GET /v1/connect/flows/{state_id}`. With `same_device: true` the browser is on the home's own computer:
        the home listens on 127.0.0.1 for the service's redirect, exactly as `muse connect` does (`mode:
        loopback`). Otherwise (a phone, a remote client) a redirect to localhost would not reach the home, so
        `mode` is `paste_code`: the service shows a code, and the client sends it with
        `POST /v1/connect/flows/{state_id}/code`. A flow ends after 5 minutes.
      parameters:
        - {$ref: "#/components/parameters/provider"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OneTapStart"}
      responses:
        "201":
          description: "The flow and the address to open."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Flow"}
        "400": {$ref: "#/components/responses/Invalid"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/Unavailable"}
        default: {$ref: "#/components/responses/Error"}

  /v1/connect/flows/{state_id}:
    get:
      operationId: getOneTap
      x-scope: connect.write
      x-roles: [owner]
      summary: "Where a one-tap connection stands: pending, connected or failed."
      description: |
        When `connected`, `gained` says what was added and `restart` whether the router must start again to use it.
      parameters:
        - {$ref: "#/components/parameters/flowId"}
      responses:
        "200":
          description: "The flow."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Flow"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      operationId: cancelOneTap
      x-scope: connect.write
      x-roles: [owner]
      summary: "Cancel a one-tap connection and stop listening."
      parameters:
        - {$ref: "#/components/parameters/flowId"}
      responses:
        "200":
          description: "Cancelled."
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancelled: {type: boolean}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Error"}

  /v1/connect/flows/{state_id}/code:
    post:
      operationId: finishOneTapWithCode
      x-scope: connect.write
      x-roles: [owner]
      summary: "paste_code mode: send the code the service showed."
      description: |
        The one other call whose body may hold something key-shaped. The code is traded for the key at once over verified https and kept nowhere.
      parameters:
        - {$ref: "#/components/parameters/flowId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OneTapCode"}
      responses:
        "200":
          description: "The flow after the exchange."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Flow"}
        "400": {$ref: "#/components/responses/Invalid"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Error"}

  /v1/home/restart-proxy:
    post:
      operationId: restartProxy
      x-scope: home.admin
      x-roles: [owner]
      summary: "Restart the router so it reads the current keys and settings."
      description: |
        Uses `muse restart`. Answers `conflict` when this home does not manage the router (it was not started by Muse here and Docker was not found). No request body.
      responses:
        "200":
          description: "Restarted."
          content:
            application/json:
              schema:
                type: object
                properties:
                  restarted: {type: boolean}
                  command: {type: string}
                  recorded: {type: boolean}
        "409": {$ref: "#/components/responses/Conflict"}
        "503": {$ref: "#/components/responses/Unavailable"}
        default: {$ref: "#/components/responses/Error"}

  /v1/apps/presets:
    get:
      operationId: listAppPresets
      x-scope: apps.read
      x-roles: [owner]
      summary: "Ready-made settings for the programs people point at Muse, and the address to paste."
      description: |
        From `muse/presets.py`. `steps` are the exact fields to paste where, with the address filled in and `{key}` left for the app to fill with the new key, once, on the person's screen. `verified_on` is null when the steps were not confirmed against the program's own documentation.
      responses:
        "200":
          description: "The address and the presets."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AppPresets"}
        default: {$ref: "#/components/responses/Error"}

  /v1/settings:
    get:
      operationId: getSettings
      x-scope: settings.read
