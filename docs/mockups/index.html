<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Muse 示範版 / Muse mock-up</title>
<style>
:root{
  color-scheme:light dark;
  --stage:#e8e0d1; --bg:#f7f1e7; --surface:#fffdf9; --surface2:#f1e9dc; --ink:#26302b; --muted:#5b645d; --line:#e0d5c3;
  --accent:#1d6b50; --accent-ink:#ffffff; --accent-soft:#dcebe2; --accent-line:#a9cdb9;
  --warn:#8a4b00; --warn-soft:#f8e7c8; --bad:#a3301d; --bad-soft:#f7dcd5; --track:#e6dccb; --tick:#b9ac95;
  --shadow:0 1px 2px rgba(60,40,10,.06),0 6px 20px rgba(60,40,10,.07);
  --scrim:rgba(30,25,15,.45);
  --font:system-ui,-apple-system,"Segoe UI","PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei","Heiti TC","WenQuanYi Zen Hei",Roboto,"Helvetica Neue",Arial,sans-serif;
}
:root[data-theme="dark"]{ color-scheme:dark }
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --stage:#0c100e; --bg:#141a17; --surface:#1c2420; --surface2:#262f2a; --ink:#ecf0e9; --muted:#a6b1a9; --line:#334039;
    --accent:#6fd0a4; --accent-ink:#0d2218; --accent-soft:#1f3a2d; --accent-line:#2f5a46;
    --warn:#f0b45a; --warn-soft:#3a2a10; --bad:#ff9d8b; --bad-soft:#40201a; --track:#2f3a34; --tick:#52605a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --stage:#0c100e; --bg:#141a17; --surface:#1c2420; --surface2:#262f2a; --ink:#ecf0e9; --muted:#a6b1a9; --line:#334039;
  --accent:#6fd0a4; --accent-ink:#0d2218; --accent-soft:#1f3a2d; --accent-line:#2f5a46;
  --warn:#f0b45a; --warn-soft:#3a2a10; --bad:#ff9d8b; --bad-soft:#40201a; --track:#2f3a34; --tick:#52605a;
}
*{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--stage);color:var(--ink);font:17px/1.55 var(--font);font-variant-numeric:tabular-nums;display:flex;flex-direction:column;overflow-x:hidden;overflow-wrap:anywhere}
h1,h2,h3,h4,p,ul,ol{margin:0;padding:0}
ul,ol{list-style:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:1.25em;height:1.25em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- page toolbar (outside the app) ---------- */
.tb{flex:none;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line);font-size:15px}
.tb .brand{font-weight:700;letter-spacing:.02em;margin-right:4px}
.tb .grp{display:flex;align-items:center;gap:8px}
.tb label,.tb .lbl{color:var(--muted);font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface2)}
.seg button{border:0;background:transparent;padding:0 14px;min-height:44px;font-size:15px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tb select,.tb .tbtn{min-height:44px;border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:0 12px;font-size:15px}
.tb .tbtn{font-weight:600}
.tb .sp{flex:1 1 auto}

/* ---------- stage & device ---------- */
#stage{flex:1;min-height:0;overflow:auto;padding:20px 16px 28px;display:flex}
#scene{margin:auto;display:flex;flex-wrap:wrap;gap:20px;justify-content:center;align-items:flex-start;width:100%;max-width:1440px}
.device{position:relative;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;isolation:isolate}
.device.phone{width:390px;height:844px;flex:none;border-radius:40px;margin:10px;box-shadow:0 0 0 10px #1c211f,0 0 0 11px #3a423e,0 30px 70px rgba(0,0,0,.28)}
.device.desktop{flex:1 1 720px;max-width:1100px;height:740px;border-radius:14px;box-shadow:0 0 0 1px var(--line),0 30px 70px rgba(0,0,0,.2)}
.fakebar{flex:none;height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:14px;font-weight:600;background:var(--bg)}
.fakebar .mock{margin:0}
.winbar{flex:none;height:40px;display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--surface2);border-bottom:1px solid var(--line);font-size:14px;color:var(--muted)}
.winbar .dots{display:flex;gap:7px}
.winbar .dots i{width:12px;height:12px;border-radius:50%;background:var(--line);display:block}
.winbar .mid{flex:1;text-align:center;font-weight:600}
.mock{display:inline-flex;align-items:center;gap:6px;font-size:13px;line-height:1;padding:6px 10px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-weight:700;border:1px dashed currentColor;white-space:nowrap}
.app{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.device.desktop .app{flex-direction:row}
@media (max-width:520px){
  #stage{padding:0}
  .device.phone{width:100%;height:100%;margin:0;border-radius:0;box-shadow:none}
  .fakebar{display:none}
  #scene{margin:0;max-width:none;height:100%;flex-wrap:nowrap}
  .tb .brand{display:none}
  .tb{padding:6px 12px;gap:6px 10px}
  .tb .seg button{padding:0 11px}
}

/* ---------- layout inside the app ---------- */
.main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.topbar{flex:none;display:flex;align-items:center;gap:8px;padding:6px 16px 4px;min-height:64px}
.topbar h1{flex:1;font-size:28px;line-height:1.2;font-weight:750;letter-spacing:0}
.topbar .sub{display:block;font-size:15px;font-weight:500;color:var(--muted);margin-top:2px}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:8px 16px 24px;scroll-behavior:auto}
.col{display:flex;flex-direction:column;gap:16px;max-width:680px;margin:0 auto}
.device.desktop .topbar{padding:20px 32px 4px;max-width:none}
.device.desktop .scroll{padding:8px 32px 32px}
.device.desktop .topbar h1{font-size:30px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 22px;border-radius:16px;border:1.5px solid transparent;font-weight:650;font-size:17px;line-height:1.2;text-align:center;background:var(--surface2);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.sec{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.sec:hover{border-color:var(--accent)}
.btn.link{background:transparent;color:var(--accent);min-height:44px;padding:0 10px;font-weight:650}
.btn.danger{background:var(--surface);border-color:var(--bad);color:var(--bad)}
.btn.small{min-height:44px;padding:0 16px;font-size:16px;border-radius:14px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{width:48px;height:48px;border-radius:14px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
.icon-btn:hover{background:var(--surface2)}
.pausebtn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:650;font-size:16px}
.pausebtn[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.card h2{font-size:20px;line-height:1.3;font-weight:700}
.card h3{font-size:17px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:15px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px}
.sp{flex:1}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:650;line-height:1.2;padding:5px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--ink)}
.tag svg.i{width:1.1em;height:1.1em}
.tag.ok{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.tag.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.tag.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.tag.dash{border-style:dashed}

/* banners */
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--warn-soft);color:var(--ink)}
.banner .ic{color:var(--warn);margin-top:2px}
.banner b{display:block;font-size:17px}
.banner span{font-size:15px;color:var(--muted)}
.banner .btn{flex:none;margin-left:auto}
.banner.info{background:var(--surface2)}
.banner.info .ic{color:var(--muted)}
.banner.bad{background:var(--bad-soft)}
.banner.bad .ic{color:var(--bad)}

/* tab bar / sidebar */
.tabbar{flex:none;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px 10px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;min-height:56px;padding:4px 0;font-size:13px;font-weight:550;color:var(--muted);border-radius:14px;line-height:1.2}
.tab .pill{display:flex;align-items:center;justify-content:center;width:56px;height:30px;border-radius:999px}
.tab svg.i{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent);font-weight:750}
.tab[aria-current="page"] .pill{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent-line)}
.tab .dotb{position:absolute;top:-2px;right:6px;min-width:20px;height:20px;border-radius:10px;background:var(--bad);color:var(--surface);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
.tab .pill{position:relative}
.sidebar{flex:none;width:236px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;gap:4px}
.sidebar .logo{display:flex;align-items:center;gap:10px;padding:4px 10px 16px;font-size:22px;font-weight:800}
.sidebar .sbtn{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 12px;border-radius:14px;border:0;background:transparent;font-size:17px;font-weight:550;color:var(--ink);text-align:left;width:100%}
.sidebar .sbtn:hover{background:var(--surface2)}
.sidebar .sbtn[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:750;box-shadow:inset 3px 0 0 var(--accent)}
.sidebar hr{border:0;border-top:1px solid var(--line);margin:10px 4px}
.sidebar .sbtn .dotb{margin-left:auto;min-width:22px;height:22px;border-radius:11px;background:var(--bad);color:var(--surface);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px}

/* gauge */
.gauge{position:relative;display:grid;place-items:center}
.gauge svg{display:block;overflow:visible}
.gauge .track{stroke:var(--track)}
.gauge .fill{stroke:var(--accent);transition:stroke-dasharray 1.1s cubic-bezier(.2,.8,.2,1)}
.gauge.low .fill{stroke:var(--warn)}
.gauge.none .fill{stroke:var(--muted)}
.gauge .tick{stroke:var(--tick)}
.gauge .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.gauge .num{font-weight:800;letter-spacing:-.02em;line-height:1}
.gauge.paused{opacity:.55}
.hero{padding:22px 18px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;background:linear-gradient(180deg,var(--surface) 0%,var(--surface) 60%,var(--accent-soft) 160%)}
.hero .status{display:inline-flex;align-items:center;gap:8px;font-size:18px;font-weight:700;margin-top:-6px}
.hero .status svg{width:1.2em;height:1.2em}
.refill{display:flex;align-items:center;gap:12px;margin-top:10px;padding:10px 16px;border-radius:16px;background:var(--surface2);border:1px solid var(--line)}
.refill .big{font-size:24px;font-weight:750;letter-spacing:.01em}
.refill small{display:block;font-size:14px;color:var(--muted);line-height:1.3;text-align:left}
.refill svg{color:var(--accent);width:1.6em;height:1.6em}
.rows{display:flex;flex-direction:column;padding:4px 0}
.rows>.r{display:flex;align-items:center;gap:14px;min-height:68px;padding:10px 18px;border:0;background:transparent;width:100%;text-align:left;border-top:1px solid var(--line)}
.rows>.r:first-child{border-top:0}
button.r:hover{background:var(--surface2)}
.rows .ico{width:42px;height:42px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.rows .t{display:flex;flex-direction:column;line-height:1.3}
.rows .t small{font-size:15px;color:var(--muted)}
.rows .t b{font-size:17px}
.rows .chev{margin-left:auto;color:var(--muted)}
.bar{height:12px;border-radius:999px;background:var(--track);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bar.est>i{background:repeating-linear-gradient(135deg,var(--accent) 0 5px,var(--accent-soft) 5px 9px);outline:2px dashed var(--accent);outline-offset:-2px}
.bar.low>i{background:var(--warn)}
.bar.thin{height:8px}

/* ask */
.thread{display:flex;flex-direction:column;gap:14px;padding-bottom:6px}
.bub{max-width:88%;padding:12px 16px;border-radius:20px;font-size:17px;line-height:1.6}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:6px}
.bub.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px;box-shadow:var(--shadow)}
.bub.bot p+p{margin-top:8px}
.quiet{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:15px;color:var(--muted);line-height:1.4}
.quiet .lnk{border:0;background:transparent;color:var(--accent);font-weight:650;font-size:15px;min-height:44px;padding:0 8px;text-decoration:underline;text-underline-offset:3px}
.techline{margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--surface2);font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,"Noto Sans Mono CJK TC",monospace;color:var(--muted);overflow-wrap:anywhere}
.techline b{color:var(--ink)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.cardx{align-self:stretch;background:var(--surface);border:1.5px solid var(--accent-line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.cardx h3{font-size:18px}
.cardx .lead{display:flex;gap:10px;align-items:flex-start}
.cardx .lead .ico{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.cardx.done{border-color:var(--line);background:var(--surface2)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 140px}
.choice{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:18px;padding:14px;min-height:64px}
.opt:hover{border-color:var(--accent)}
.opt.best{border-color:var(--accent);background:var(--accent-soft)}
.opt .ico{width:40px;height:40px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;flex:none;color:var(--accent)}
.opt b{display:block;font-size:17px;line-height:1.35}
.opt small{display:block;font-size:15px;color:var(--muted);line-height:1.4;margin-top:2px}
.opt .tag{margin-top:6px}
.typing{display:flex;gap:6px;padding:16px 18px}
.typing i{width:9px;height:9px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite both}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.composer{flex:none;display:flex;gap:10px;align-items:flex-end;padding:10px 12px;background:var(--bg);border-top:1px solid var(--line)}
.composer input{flex:1;min-height:52px;border-radius:26px;border:1.5px solid var(--line);background:var(--surface);padding:0 18px;font-size:17px}
.composer input:disabled{opacity:.6}
.composer .send{width:52px;height:52px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.composer .send[disabled]{opacity:.45}
.device.desktop .composer{padding:12px 32px}
.device.desktop .composer input{max-width:none}
.pnote{padding:2px 16px 0;font-size:15px;color:var(--muted)}

/* chores */
.addbox textarea,.field{width:100%;min-height:76px;border:1.5px solid var(--line);background:var(--bg);border-radius:16px;padding:12px 14px;resize:none;font-size:17px;line-height:1.5}
input.field{min-height:52px;padding:0 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;min-height:44px;padding:8px 14px;font-size:15px;font-weight:550;text-align:left;line-height:1.3}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:750}
.chip[aria-pressed="true"]::before{content:"\2713\00a0"}
.chore h3{font-size:18px;line-height:1.4;font-weight:700}
.chore .meta{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px;margin-top:8px}
.chore .meta dt{color:var(--muted)}
.chore .meta dd{margin:0}
.chore .budget{margin-top:10px;font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
.chore.new{animation:pop .5s ease}
@keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:26px 18px}
.empty svg{width:72px;height:72px;color:var(--accent);opacity:.85}
.empty h2{font-size:20px}
.empty p{color:var(--muted);max-width:30em}

/* helpers */
.hgrid{display:grid;gap:14px}
.device.desktop .hgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
.device.desktop .col.wide{max-width:980px}
.hcard{display:flex;flex-direction:column;gap:12px}
.hcard .head{display:flex;gap:14px;align-items:center}
.hcard .head h3{font-size:20px}
.hcard .nums{font-size:17px;font-weight:650}
.hcard dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:15px}
.hcard dt{color:var(--muted)}
.hcard dd{margin:0}
.srcnote{font-size:14px;color:var(--muted);display:flex;gap:8px;align-items:flex-start;line-height:1.4}
.srcnote svg{margin-top:2px}
.sect{font-size:20px;font-weight:750;margin:10px 2px 0}
.sect small{display:block;font-size:15px;font-weight:500;color:var(--muted);margin-top:2px}
.addrow{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 16px;min-height:76px;box-shadow:var(--shadow)}
.addrow:hover{border-color:var(--accent)}
.addrow .nm{font-size:18px;font-weight:700}
.addrow .meta{font-size:15px;color:var(--muted);line-height:1.4}
.addrow .rank{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;flex:none}
.addrow.first{border:2px solid var(--accent)}
.disc{width:100%;display:flex;align-items:center;gap:10px;min-height:56px;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:0 16px;font-weight:700;font-size:18px;text-align:left}
.disc svg.chv{margin-left:auto;transition:transform .2s}
.disc[aria-expanded="true"] svg.chv{transform:rotate(90deg)}
.mini{display:flex;align-items:center;gap:14px;padding:12px 4px;border-top:1px solid var(--line)}
.mini:first-child{border-top:0}
.mini .t{display:flex;flex-direction:column;line-height:1.35}
.mini .t small{font-size:15px;color:var(--muted)}

/* activity */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{background:var(--surface2);border-radius:16px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:24px;line-height:1.2;font-weight:800}
.stat span{font-size:14px;color:var(--muted);line-height:1.3;display:block}
.switchrow{display:flex;align-items:center;gap:14px}
.switch{flex:none;width:68px;height:40px;border-radius:20px;border:2px solid var(--muted);background:var(--surface2);position:relative;padding:0}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:var(--muted);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--warn-soft);border-color:var(--warn)}
.switch[aria-checked="true"]::after{transform:translateX(28px);background:var(--warn)}
.switch .sw{position:absolute;inset:0;display:flex;align-items:center;font-size:13px;font-weight:800;pointer-events:none}
.logday{font-size:15px;font-weight:700;color:var(--muted);margin:6px 2px -4px;letter-spacing:.02em}
.logitem{display:flex;gap:12px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.logitem .tm{flex:none;width:48px;font-size:15px;font-weight:700;color:var(--muted);padding-top:2px}
.logitem .tx{flex:1;display:flex;flex-direction:column;gap:6px}
.logitem .tx p{font-size:17px;line-height:1.5}
.logitem .tx small{font-size:15px;color:var(--muted);line-height:1.4}
.logitem.wait{border:1.5px solid var(--warn);background:var(--warn-soft)}

/* settings */
.stepper{display:flex;align-items:center;gap:12px;justify-content:center;margin:6px 0}
.stepper .val{min-width:140px;text-align:center;font-size:34px;font-weight:800}
.stepper button{width:56px;height:56px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center}
.stepper button:hover{border-color:var(--accent)}
.stepper button[disabled]{opacity:.4}
.radio{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;min-height:64px}
.radio .dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);flex:none;margin-top:2px;display:grid;place-items:center}
.radio[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.radio[aria-checked="true"] .dot{border-color:var(--accent);background:var(--accent)}
.radio[aria-checked="true"] .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent-ink)}
.radio b{display:block}
.radio small{font-size:15px;color:var(--muted);line-height:1.4;display:block}
.perm{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.perm:first-of-type{border-top:0}
.perm p{flex:1;font-size:17px;line-height:1.5}
.perm.off p{text-decoration:line-through;color:var(--muted)}
.memrow{display:flex;gap:8px;align-items:center;padding:6px 0}
.memrow input{flex:1}

/* sheets & overlays */
.layer{position:absolute;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .25s}
.sheet{position:relative;width:100%;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:28px 28px 0 0;padding:14px 20px 28px;display:flex;flex-direction:column;gap:14px;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet.enter{animation:up .34s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);align-self:center;flex:none}
.sheet h2{font-size:23px;line-height:1.3;font-weight:750}
.device.desktop .layer{align-items:center}
.device.desktop .sheet{width:500px;border-radius:24px;max-height:86%}
.device.desktop .sheet .grab{display:none}
@keyframes up{from{transform:translateY(60%);opacity:.3}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.device.desktop .sheet.enter{animation:pop .3s ease}
.sample{font-size:14px;color:var(--muted);text-align:center;border:1px dashed var(--line);border-radius:10px;padding:4px 8px}
.okmark{width:76px;height:76px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;align-self:center;animation:pop .5s ease}
.okmark svg{width:44px;height:44px;stroke-width:3}
.spinner{width:46px;height:46px;border-radius:50%;border:5px solid var(--track);border-top-color:var(--accent);animation:spin 1s linear infinite;align-self:center}
@keyframes spin{to{transform:rotate(360deg)}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:16px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600}
.quote{background:var(--surface2);border-radius:14px;padding:12px 14px;font-size:16px;line-height:1.5}
.steps{display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps li{display:flex;gap:12px;align-items:flex-start;font-size:16px;line-height:1.5}
.steps li::before{counter-increment:s;content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:800;display:grid;place-items:center;font-size:15px}
.progress{height:10px;border-radius:5px;background:var(--track);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);animation:load 2.2s linear forwards}
@keyframes load{to{width:100%}}

/* guided key flow */
.flow{position:absolute;inset:0;z-index:35;background:var(--bg);display:flex;flex-direction:column;animation:fade .2s}
.flow .fbar{flex:none;display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--surface2);border-bottom:1px solid var(--line)}
.flow .url{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px;color:var(--muted);display:flex;gap:8px;align-items:center;min-height:44px;overflow:hidden;white-space:nowrap}
.flow .page{flex:1;min-height:0;overflow-y:auto;padding:20px 16px 280px;background:#fbfbf9;color:#222;display:flex;flex-direction:column;align-items:center;gap:16px}
:root[data-theme="dark"] .flow .page{background:#e9e9e4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .flow .page{background:#e9e9e4}}
.flow .page .pg{width:100%;max-width:420px;background:#fff;border:1px solid #d8d8d2;border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px;color:#222}
.flow .page h3{font-size:20px;color:#222}
.flow .page .fakein{border:1px solid #bbb;border-radius:8px;min-height:44px;padding:10px 12px;background:#fff;color:#555;font-size:16px;overflow-wrap:anywhere}
.flow .page .pbtn{min-height:48px;border-radius:8px;border:2px solid #3a3a3a;background:#3a3a3a;color:#fff;font-weight:650;font-size:16px;padding:0 16px}
.flow .page .pbtn.hl{box-shadow:0 0 0 4px #fff,0 0 0 8px var(--accent);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px #fff,0 0 0 12px var(--accent-line)}}
.flow .pagelabel{font-size:14px;color:#555}
.stepcard{position:absolute;left:0;right:0;bottom:0;z-index:2;background:var(--surface);border-radius:26px 26px 0 0;padding:16px 20px 24px;box-shadow:0 -10px 40px rgba(0,0,0,.28);display:flex;flex-direction:column;gap:10px;animation:up .32s cubic-bezier(.2,.8,.2,1)}
.device.desktop .stepcard{left:50%;right:auto;width:560px;transform:translateX(-50%);bottom:16px;border-radius:24px}
.stepcard .sn{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--accent);font-size:15px}
.dots{display:flex;gap:6px}
.dots i{width:22px;height:6px;border-radius:3px;background:var(--track)}
.dots i.on{background:var(--accent)}
.stepcard h2{font-size:21px;line-height:1.35}

/* onboarding */
.ob{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.ob .body{flex:1;min-height:0;overflow-y:auto;padding:12px 24px 12px;display:flex;flex-direction:column;gap:16px;max-width:560px;width:100%;margin:0 auto}
.ob .foot{flex:none;padding:12px 24px 24px;display:flex;flex-direction:column;gap:6px;max-width:560px;width:100%;margin:0 auto}
.ob h1{font-size:30px;line-height:1.25;font-weight:800}
.ob .lead{font-size:19px;line-height:1.6}
.stepper-top{display:flex;align-items:center;justify-content:space-between;padding:10px 24px 0;max-width:560px;width:100%;margin:0 auto;gap:10px}
.stepper-top .t{font-size:15px;font-weight:700;color:var(--muted)}
.stepper-top .dots i{width:30px;height:7px}
.mark{display:flex;align-items:center;gap:12px;font-size:30px;font-weight:850;letter-spacing:.01em;margin-top:6px}
.mark svg{width:56px;height:56px}
.promises{display:flex;flex-direction:column;gap:8px}
.promises li{display:flex;gap:12px;align-items:center;font-size:17px;font-weight:600;line-height:1.4}
.promises .ico{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.bigopt{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.bigopt:hover{border-color:var(--accent)}
.bigopt .tag{align-self:flex-start}
.bigopt b{font-size:18px;line-height:1.4}
.gain{background:var(--accent-soft);border:1.5px solid var(--accent-line);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.gain .row{align-items:flex-start}
.gain p{font-size:16px;line-height:1.5}
.gain .ico{color:var(--accent);margin-top:2px}

/* toast */
#toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);z-index:60;pointer-events:none;display:flex;justify-content:center;width:calc(100% - 32px)}
#toast div{background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:16px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.3);animation:up .3s ease;max-width:420px;text-align:center}

/* desktop popover */
#pop{flex:0 0 290px;display:flex;flex-direction:column;gap:6px}
#pop[hidden]{display:none}
.menubar{height:30px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:flex-end;gap:14px;padding:0 12px;font-size:14px;font-weight:600}
.menubar .mi{display:flex;align-items:center;gap:6px;padding:2px 8px;border-radius:7px;background:var(--accent-soft);color:var(--accent)}
.menubar .mi svg{width:16px;height:16px}
.popover{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 16px 50px rgba(0,0,0,.2);display:flex;flex-direction:column;gap:12px;align-items:stretch;position:relative}
.popover::before{content:"";position:absolute;top:-7px;right:30px;width:12px;height:12px;background:var(--surface);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
.popover .g{display:flex;gap:14px;align-items:center}
.popover .gtx b{font-size:30px;line-height:1.1;display:block;font-weight:800}
.popover .gtx span{font-size:15px;color:var(--muted);line-height:1.35;display:block}
.popover .line{display:flex;justify-content:space-between;gap:10px;font-size:15px;padding:8px 0;border-top:1px solid var(--line)}
.popover .line b{font-weight:700}
.popover .btnrow .btn{flex:1 1 100px;min-height:46px;font-size:16px;padding:0 10px}

/* endpoint */
.codebox{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:14px;padding:6px 6px 6px 14px;background:var(--bg);font:16px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.codebox span{flex:1;overflow-wrap:anywhere}
.appline{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.appline:first-of-type{border-top:0}
.appline .t{flex:1 1 220px;display:flex;flex-direction:column;line-height:1.4}
.appline .t small{font-size:15px;color:var(--muted)}
.appline code{font:15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--surface2);padding:2px 8px;border-radius:8px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
  .spinner{animation:none;border-top-color:var(--accent);border-right-color:var(--accent)}
  .typing i{animation:none;opacity:.6}
}

.ob .seg{align-self:flex-start}
.ob .seg button{min-width:110px}

.mini{flex-wrap:wrap}.mini .tag{margin-left:50px}
.tb .mock{display:none}
@media (max-width:520px){.tb .mock{display:inline-flex}}
