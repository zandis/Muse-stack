[package]
name = "muse-core"
version = "0.1.0"
edition = "2021"
description = "Portable core of Muse: the pure quota, pacing and cache-key rules, kept in step with the Python implementation by a conformance suite."
publish = false
license = "Apache-2.0"

[lib]
name = "muse_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: JSON numbers must parse to the exact f64 Python wrote.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
# Records (src/records.rs): Ed25519 signatures, HMAC-SHA-256 references, NFC for signed text.
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast", "zeroize"] }
# Permissions (core/src/permissions.rs): the token format. Pinned exactly; the Python twin
# (biscuit-python 0.4.0) wraps this same release, so both sides run the same Datalog engine.
biscuit-auth = { version = "=6.0.0", default-features = false, features = ["datalog-macro"] }
# Vault (src/vault.rs). Pinned exactly, at the versions `age` itself resolves, so
# each primitive is compiled once. See docs/spec/interfaces/vault-format.md section 17.
age = { version = "=0.12.1", default-features = false }
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc"] }
bech32 = "=0.11.1"
chacha20poly1305 = "=0.10.1"
getrandom = "=0.2.17"
hkdf = "=0.12.4"
hmac = "=0.12.1"
subtle = "=2.6.1"
unicode-normalization = "=0.1.26"
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }
zeroize = { version = "=1.9.1", features = ["derive"] }

[dev-dependencies]
# Only to cross-check the hand-ported Pacific DST rule against tzdata (tests/pacific_tzdata.rs).
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }

# The records tests verify tens of thousands of Ed25519 signatures; unoptimised
# curve arithmetic makes them take minutes. Only these two dependencies are
# affected, and only in dev and test builds.
[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
